      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:var(--bg); color:var(--txt); padding:24px; font-size:14px;
    }
    .page-header { margin-bottom:18px; }
    .page-title { font-size:22px; font-weight:800; letter-spacing:-.4px; }
    .page-sub   { font-size:13px; color:var(--txt2); margin-top:3px; max-width:720px; line-height:1.5; }

    .toolbar {
      display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;
      background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px;
    }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--txt3); font-weight:700; }
    input[type=date], select {
      padding:8px 10px; border:1.5px solid var(--border2); border-radius:var(--radius-s);
      font-family:inherit; font-size:13px; background:var(--white); color:var(--txt); cursor:pointer;
    }
    select { min-width:170px; }
    input[type=date]:focus, select:focus { outline:none; border-color:var(--primary); }
    .btn {
      border:none; background:var(--primary); color:#fff; border-radius:var(--radius-s);
      padding:9px 16px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
      box-shadow:var(--shadow); white-space:nowrap;
    }
    .btn:disabled { opacity:.5; cursor:default; }
    .btn.excel { background:#16a34a; }
    .btn.ghost { background:var(--white); color:var(--txt); border:1px solid var(--border2); }
    .btn.ghost:hover { border-color:var(--primary); color:var(--primary); }
    .btn.sm { padding:5px 10px; font-size:12px; box-shadow:none; }
    .spacer { flex:1 1 auto; }

    .status-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--txt2); margin-bottom:14px; }
    .status-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .status-dot.ok { background:var(--green); } .status-dot.bad { background:var(--red); }
    .status-dot.wait { background:var(--yellow); }

    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
    .kpi { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px; }
    .kpi-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--txt3); }
    .kpi-val { font-size:24px; font-weight:800; margin-top:2px; }
    .kpi-val.bad { color:#dc2626; } .kpi-val.warn { color:#d97706; }
    .kpi-sub { font-size:11.5px; color:var(--txt3); margin-top:1px; }

    .tabs { display:flex; gap:4px; border-bottom:1.5px solid var(--border); margin-bottom:14px; overflow-x:auto; }
    .tab { border:none; background:none; padding:10px 14px; font-family:inherit; font-size:13.5px; font-weight:700;
      color:var(--txt3); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1.5px; white-space:nowrap; }
    .tab.active { color:var(--primary); border-bottom-color:var(--primary); }
    .tab .n { display:inline-block; min-width:20px; padding:1px 6px; border-radius:999px; background:#eef0f6;
      color:var(--txt2); font-size:11px; margin-left:4px; }
    .tab.active .n { background:rgba(99,102,241,.14); color:var(--primary); }
    .panel { display:none; } .panel.active { display:block; }

    .card {
      background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;
    }
    .bloque-cab { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px; }
    .bloque-tit { font-size:15.5px; font-weight:800; }
    .bloque-tit .placa { font-weight:600; color:var(--txt3); font-size:13px; margin-left:4px; }
    .bloque-sub { font-size:12.5px; color:var(--txt2); margin-top:3px; line-height:1.5; }
    .aviso { background:#fef3c7; border:1px solid #fcd34d; color:#92400e; border-radius:var(--radius-s);
      padding:8px 12px; font-size:12.5px; line-height:1.5; margin-bottom:10px; }

    table { width:100%; border-collapse:collapse; }
    th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--txt3);
      padding:8px; border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:9px 8px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr.gris td { color:var(--txt3); }
    .hora { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:700; white-space:nowrap; }
    td.bus b { white-space:nowrap; }
    .sub { font-size:11.5px; color:var(--txt3); margin-top:2px; }
    .empty { text-align:center; color:var(--txt3); padding:26px; font-size:13.5px; line-height:1.7; }

    /* Planilla de vueltas: matriz que se desplaza horizontalmente */
    .planilla-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-s); }
    table.planilla th, table.planilla td { text-align:center; border-right:1px solid var(--border); }
    table.planilla th:last-child, table.planilla td:last-child { border-right:none; }
    table.planilla th { background:#f8f8fb; text-transform:none; letter-spacing:0; font-size:12px; color:var(--txt2); }
    table.planilla th .obj { display:block; font-size:10.5px; font-weight:600; color:var(--txt3); }
    table.planilla td.vta { font-weight:800; }
    .celda .hora { display:block; font-size:12.5px; }
    .desv { display:inline-block; margin-top:2px; border-radius:6px; padding:0 6px; font-size:11px; font-weight:800; }
    .desv.atraso { background:rgba(239,68,68,.13); color:#dc2626; }
    .desv.adelanto { background:rgba(245,158,11,.16); color:#b45309; }
    .desv.atiempo { background:rgba(34,197,94,.14); color:#16a34a; }
    .no-paso { color:#c4c4cc; }
    table.planilla tr.con-abandono td.vta { box-shadow:inset 3px 0 0 #dc2626; color:#dc2626; }
    table.planilla td.novedades { text-align:left; min-width:150px; }
    .tag-ab { display:inline-flex; gap:5px; align-items:center; margin:2px 4px 2px 0; border:none; cursor:pointer;
      background:rgba(239,68,68,.12); color:#dc2626; border-radius:6px; padding:3px 7px; font-family:inherit;
      font-size:11.5px; font-weight:700; white-space:nowrap; }
    .tag-ab span { font-weight:600; opacity:.8; }
    .tag-ab:hover { background:rgba(239,68,68,.2); }
    .tag-ex { display:inline-block; margin:2px 0; background:rgba(245,158,11,.16); color:#b45309; border-radius:6px;
      padding:3px 7px; font-size:11.5px; font-weight:700; white-space:nowrap; }
    .leyenda { font-size:11.5px; color:var(--txt3); margin:8px 0 2px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .nota { font-size:11.5px; color:var(--txt3); margin:8px 0 2px; line-height:1.55; }
    details { margin-top:10px; }
    summary { cursor:pointer; font-size:12.5px; font-weight:700; color:var(--primary); padding:4px 0; }
    details table { margin-top:6px; }

    .pill { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px;
      font-size:11.5px; font-weight:700; white-space:nowrap; }
    .pill.critico { background:rgba(239,68,68,.13); color:#dc2626; }
    .pill.aviso { background:rgba(245,158,11,.16); color:#b45309; }
    .pill.abandono { background:rgba(239,68,68,.13); color:#dc2626; }
    .pill.sinregreso { background:#7f1d1d; color:#fff; }
    .pill.encierro { background:rgba(136,136,136,.15); color:var(--txt3); }
    .vel { font-weight:800; }
    .filtros { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .chip { border:1.5px solid var(--border2); background:var(--white); border-radius:999px; padding:4px 11px;
      font-family:inherit; font-size:12px; font-weight:700; color:var(--txt2); cursor:pointer; }
    .chip.on { border-color:var(--primary); color:var(--primary); background:rgba(99,102,241,.07); }

    /* Modal del mapa */
    .modal-overlay { position:fixed; inset:0; background:rgba(17,17,17,.45); z-index:1500;
      display:flex; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.hidden { display:none; }
    .modal { background:var(--white); border-radius:var(--radius); box-shadow:0 12px 40px rgba(0,0,0,.28);
      width:100%; max-width:980px; height:min(86vh, 760px); display:flex; flex-direction:column; overflow:hidden; }
    .modal-head { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .modal-head h3 { font-size:16px; font-weight:800; flex:1; }
    .modal-x { border:none; background:none; font-size:24px; line-height:1; color:var(--txt3); cursor:pointer; }
    .estilos { display:flex; border:1.5px solid var(--border2); border-radius:var(--radius-s); overflow:hidden; }
    .estilos button { border:none; background:var(--white); padding:6px 11px; font-family:inherit; font-size:12.5px;
      font-weight:600; color:var(--txt2); cursor:pointer; }
    .estilos button + button { border-left:1px solid var(--border); }
    .estilos button.on { background:var(--primary); color:#fff; }
    .mapa-info { padding:8px 18px; font-size:12.5px; color:var(--txt2); border-bottom:1px solid var(--border); line-height:1.5; }
    #mapaRep { flex:1; min-height:0; }
    .mk { width:14px; height:14px; border-radius:50%; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
    .pc-mk { background:#fff; border:2px solid #7c3aed; color:#111; border-radius:50%; width:24px; height:24px;
      font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.3); }
    .pc-mk.terminal { border-radius:5px; }
    .mapa-leyenda { position:absolute; bottom:24px; left:10px; z-index:500; background:rgba(255,255,255,.95);
      border:1px solid var(--border); border-radius:10px; padding:7px 10px; font-size:11.5px; box-shadow:var(--shadow); }
    .mapa-leyenda div { display:flex; align-items:center; gap:6px; margin:2px 0; }
    .mapa-leyenda .linea { width:22px; height:0; border-top:3px solid; }
    .mapa-leyenda .linea.dash { border-top-style:dashed; }

    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111; color:#fff;
      border-radius:var(--radius-s); padding:11px 20px; font-size:13px; font-weight:600; z-index:2000;
      box-shadow:0 4px 16px rgba(0,0,0,.25); transition:opacity .25s; max-width:90vw; }
    .toast.hidden { opacity:0; pointer-events:none; }

    /* Móvil: tablas → tarjetas apiladas, sin tapar el menú de la shell */
    @media (max-width:760px) {
      body { padding:16px; padding-top:64px; }
      input[type=date], select { font-size:16px; }   /* evita el auto-zoom de iOS */
      .toolbar { gap:10px; }
      .toolbar .field { flex:1 1 140px; }
      select { min-width:0; width:100%; }
      table.responsive thead { display:none; }
      table.responsive, table.responsive tbody, table.responsive tr, table.responsive td { display:block; width:100%; }
      table.responsive tr { border:1px solid var(--border); border-radius:10px; margin-bottom:10px; padding:6px 10px; background:var(--white); }
      /* Etiqueta a la izquierda; el valor (y su subtítulo) apilados a la derecha */
      table.responsive td { border:none; padding:5px 0; display:grid; grid-template-columns:auto 1fr; column-gap:12px;
        text-align:right; align-items:center; justify-items:end; }
      table.responsive td::before { content:attr(data-label); font-size:11px; font-weight:700; text-transform:uppercase;
        color:var(--txt3); text-align:left; grid-row:1 / span 3; align-self:start; justify-self:start; padding-top:2px;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
      .tabs { flex-wrap:wrap; overflow-x:visible; }
      .tab { padding:8px 10px; font-size:13px; }
      .card { padding:14px 12px; }
      .modal-overlay { padding:0; }
      .modal { height:100%; max-width:none; border-radius:0; }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="page-title">Reportes de recorrido</div>
    <div class="page-sub">Pasos por los puntos de control, excesos de velocidad y abandonos de ruta, calculados con las
      posiciones GPS de cada bus y la ruta que le asignó el despacho del día.</div>
  </div>

  <div class="toolbar">
    <div class="field"><label for="fDesde">Fecha</label><input type="date" id="fDesde" /></div>
    <div class="field"><label for="fHasta">Hasta (opcional)</label><input type="date" id="fHasta" /></div>
    <div class="field"><label for="fBus">Bus</label><select id="fBus"><option value="">Todos los buses</option></select></div>
    <div class="field"><label for="fRuta">Ruta</label>
      <select id="fRuta"><option value="">La del despacho del día</option></select></div>
    <button class="btn" id="buscarBtn" onclick="buscar()">Buscar</button>
    <div class="spacer"></div>
    <button class="btn excel" id="excelBtn" onclick="exportarExcel()" style="display:none;">Exportar Excel</button>
  </div>

  <div class="status-bar"><span class="status-dot wait" id="statusDot"></span><span id="statusText">Cargando…</span></div>

  <div class="kpis" id="kpis"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="pasos" onclick="verTab('pasos')">Puntos de control <span class="n" id="nPasos">0</span></button>
    <button class="tab" data-tab="excesos" onclick="verTab('excesos')">Excesos de velocidad <span class="n" id="nExcesos">0</span></button>
    <button class="tab" data-tab="abandonos" onclick="verTab('abandonos')">Abandonos de ruta <span class="n" id="nAbandonos">0</span></button>
    <button class="tab" data-tab="resumen" onclick="verTab('resumen')">Resumen por bus</button>
  </div>

  <div class="panel active" id="panel-pasos"></div>
  <div class="panel" id="panel-excesos"></div>
  <div class="panel" id="panel-abandonos"></div>
  <div class="panel" id="panel-resumen"></div>

  <div class="modal-overlay hidden" id="mapaModal" onclick="if(event.target===this) cerrarMapa()">
    <div class="modal">
      <div class="modal-head"><h3 id="mapaTitulo">Recorrido</h3>
        <div class="estilos" id="estilosMapa">
          <button data-k="calles" class="on" onclick="setEstiloMapa('calles')">Calles</button>
          <button data-k="satelite" onclick="setEstiloMapa('satelite')">Satélite</button>
        </div>
        <button class="modal-x" onclick="cerrarMapa()" title="Cerrar">&times;</button></div>
      <div class="mapa-info" id="mapaInfo"></div>
      <div style="position:relative; flex:1; display:flex; min-height:0;">
        <div id="mapaRep" style="flex:1;"></div>
        <div class="mapa-leyenda">
          <div><span class="linea" style="border-color:#2563eb"></span>Ruta ida (bajando)</div>
          <div><span class="linea dash" style="border-color:#ea580c"></span>Ruta regreso (subiendo)</div>
          <div><span class="linea" style="border-color:#6366f1"></span>Recorrido del bus</div>
          <div><span class="linea" style="border-color:#dc2626"></span>Tramo del evento</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

<script>
  const API = (window.location.port === '3030') ? 'http://localhost:8001' : window.location.origin;
  const LIB_EXCELJS = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
  // La ida baja (del barrio al centro) y el regreso sube.
  const TXT_SENTIDO = { ida: 'Bajando', regreso: 'Subiendo', ambos: 'Ambos sentidos' };

  async function apiFetch(path) {
    const token = localStorage.getItem('authToken');
    const res = await fetch(API + path, { headers: token ? { 'Authorization': `Bearer ${token}` } : {} });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || 'Error del servidor');
    return json;
  }

  // ── Formato (todo en hora Bogotá) ──
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function hoyBogota() { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }); }
  function fmtFecha(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return (d && m && y) ? `${d}/${m}/${y}` : iso;
  }
  function fmtHora(iso, conSeg = false) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleTimeString('es-CO', { timeZone: 'America/Bogota', hour: '2-digit', minute: '2-digit',
      ...(conSeg ? { second: '2-digit' } : {}), hour12: false });
  }
  function fmtDur(s) {
    if (s === null || s === undefined) return '—';
    s = Math.round(s);
    if (s < 60) return `${s} s`;
    if (s < 3600) return `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')} s`;
    return `${Math.floor(s / 3600)} h ${String(Math.floor((s % 3600) / 60)).padStart(2, '0')} min`;
  }
  function fmtMin(m) { return m === null || m === undefined ? '—' : `${String(m).replace('.', ',')} min`; }
  function fmtKm(m) { return m >= 1000 ? `${fmtNum(m / 1000, 1)} km` : `${fmtNum(m)} m`; }
  function fmtNum(n, dec = 0) { return n === null || n === undefined ? '—' : Number(n).toLocaleString('es-CO', { maximumFractionDigits: dec }); }
  function desvio(m) {
    if (m === null || m === undefined) return '';
    const cls = m > 0 ? 'atraso' : m < 0 ? 'adelanto' : 'atiempo';
    const txt = m > 0 ? `+${m}` : m < 0 ? `−${-m}` : '0';
    return `<span class="desv ${cls}" title="${m > 0 ? 'Atraso' : m < 0 ? 'Adelanto' : 'A tiempo'} (min)">${txt}</span>`;
  }
  function txtDesvio(m) { return m === null || m === undefined ? '' : (m > 0 ? `+${m}` : String(m)); }
  function busTxt(g) { return g.numero != null ? `Bus ${g.numero}` : `Bus #${g.bus_id}`; }

  // ── Estado ──
  let datos = null;            // respuesta del reporte
  let tabActual = 'pasos';
  let filtroNivel = 'todos';
  let esAdmin = false;

  document.addEventListener('DOMContentLoaded', init);
  window.addEventListener('message', e => { if (e.data?.type === 'VIEW_SHOWN') mapa?.invalidateSize(); });

  async function init() {
    document.getElementById('fDesde').value = hoyBogota();
    prepararGoogle();
    try {
      const u = JSON.parse(localStorage.getItem('currentUser') || '{}');
      esAdmin = u.rol === 'Administrador';
    } catch {}
    const [buses, rutas] = await Promise.all([
      apiFetch('/api/buses').catch(() => []),
      apiFetch('/api/monitoreo/rutas').catch(() => []),
    ]);
    document.getElementById('fBus').innerHTML += buses.map(b =>
      `<option value="${b.id}">Bus ${esc(b.numero)} · ${esc(b.placa || 's/p')}</option>`).join('');
    document.getElementById('fRuta').innerHTML += rutas.map(r =>
      `<option value="${r.id}">${esc(r.nombre)}${r.tiene_ida || r.tiene_regreso ? '' : ' (sin trazado)'}</option>`).join('');
    buscar();
  }

  function estado(cls, html) {
    document.getElementById('statusDot').className = 'status-dot ' + cls;
    document.getElementById('statusText').innerHTML = html;
  }

  async function buscar() {
    const desde = document.getElementById('fDesde').value || hoyBogota();
    const hasta = document.getElementById('fHasta').value;
    const busId = document.getElementById('fBus').value;
    const rutaId = document.getElementById('fRuta').value;
    let q = `?fecha=${encodeURIComponent(desde)}`;
    if (hasta) q += `&fecha_fin=${encodeURIComponent(hasta)}`;
    if (busId) q += `&bus_id=${encodeURIComponent(busId)}`;
    if (rutaId) q += `&ruta_id=${encodeURIComponent(rutaId)}`;
    const btn = document.getElementById('buscarBtn');
    btn.disabled = true;
    estado('wait', 'Analizando los recorridos…');
    try {
      datos = await apiFetch('/api/monitoreo/reportes' + q);
    } catch (e) {
      datos = null;
      estado('bad', esc(e.message));
      pintar();
      return;
    } finally { btn.disabled = false; }
    const n = datos.grupos.length;
    estado('ok', n ? `<b>${n}</b> recorrido(s) de bus analizado(s) — ${datos.fecha === datos.fecha_fin
      ? fmtFecha(datos.fecha) : `${fmtFecha(datos.fecha)} a ${fmtFecha(datos.fecha_fin)}`}.`
      : 'No hay posiciones GPS para ese filtro.');
    document.getElementById('excelBtn').style.display = esAdmin && n ? '' : 'none';
    pintar();
  }

  // ── Pintado ──
  function todos(clave) {
    return (datos?.grupos || []).flatMap((g, gi) => g[clave].map((x, i) => ({ ...x, g, gi, i })));
  }

  function pintar() {
    const grupos = datos?.grupos || [];
    const excesos = todos('excesos');
    const abandonos = todos('abandonos').filter(a => a.tipo !== 'encierro');
    const vueltas = grupos.reduce((s, g) => s + g.vueltas.length, 0);
    const criticos = excesos.filter(e => e.nivel === 'critico').length;
    const pasosControl = grupos.reduce((s, g) => s + g.pasos.filter(p => p.tipo === 'control').length, 0);
    const atrasos = grupos.reduce((s, g) => s + g.pasos.filter(p => p.desvio_min > 0).length, 0);
    const kpis = [
      ['Buses analizados', grupos.length, '', ''],
      ['Vueltas', vueltas, '', `${pasosControl} paso(s) por control`],
      ['Pasos con atraso', atrasos, atrasos ? 'warn' : '', 'frente a los minutos objetivo'],
      ['Excesos de velocidad', excesos.length, criticos ? 'bad' : excesos.length ? 'warn' : '', `${criticos} crítico(s)`],
      ['Abandonos de ruta', abandonos.length, abandonos.length ? 'bad' : '',
        [abandonos.filter(a => a.tipo === 'atajo').length ? `${abandonos.filter(a => a.tipo === 'atajo').length} atajo(s)` : '',
         `${abandonos.filter(a => !a.regreso).length} sin regreso`].filter(Boolean).join(' · ')],
    ];
    document.getElementById('kpis').innerHTML = grupos.length ? kpis.map(([l, v, c, s]) =>
      `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-val ${c}">${v}</div>
       ${s ? `<div class="kpi-sub">${s}</div>` : ''}</div>`).join('') : '';
    document.getElementById('nPasos').textContent = vueltas;
    document.getElementById('nExcesos').textContent = excesos.length;
    document.getElementById('nAbandonos').textContent = abandonos.length;
    pintarPasos(); pintarExcesos(); pintarAbandonos(); pintarResumen();
  }

  function verTab(t) {
    tabActual = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + t));
  }

  function vacio(txt) { return `<div class="card"><div class="empty">${txt}</div></div>`; }

  function cabeceraGrupo(g, gi, extra = '') {
    const ruta = g.ruta_nombre ? `${esc(g.ruta_nombre)}${g.ruta_origen === 'elegida' ? ' (elegida)' : ''}` : 'Sin ruta';
    const r = g.resumen;
    return `<div class="bloque-cab">
      <div style="flex:1; min-width:220px;">
        <div class="bloque-tit">${esc(busTxt(g))}<span class="placa">${esc(g.placa || '')}</span> · ${fmtFecha(g.fecha)}</div>
        <div class="bloque-sub">${ruta}${g.conductor ? ` · Conductor: <b>${esc(g.conductor)}</b>` : ''}
          · ${fmtNum(r.km, 1)} km · GPS ${fmtHora(r.primera)}–${fmtHora(r.ultima)}
          ${r.inicio_ruta ? ` · entró a la ruta ${fmtHora(r.inicio_ruta)}` : ''}${extra}</div>
      </div>
      <button class="btn ghost sm" onclick="verDia(${gi})">Ver recorrido</button>
    </div>
    ${g.avisos.map(a => `<div class="aviso">${esc(a)}</div>`).join('')}`;
  }

  // Abandonos y excesos de una vuelta, como etiquetas que abren el mapa.
  function novedadesVuelta(g, gi, n) {
    const ab = g.abandonos.map((a, i) => ({ a, i })).filter(x => x.a.vuelta === n && x.a.tipo !== 'encierro');
    const ex = g.excesos.filter(e => e.vuelta === n);
    const etiquetas = ab.map(({ a, i }) =>
      `<button class="tag-ab" onclick="verAbandono(${gi}, ${i})" title="Ver en el mapa">
        ${a.tipo === 'atajo' ? `Atajo ${fmtKm(a.saltado_m)}` : a.regreso ? `Abandono ${fmtDur(a.duracion_s)}` : 'Abandono sin regreso'}
        <span>${fmtHora(a.inicio)}</span></button>`);
    if (ex.length) etiquetas.push(`<span class="tag-ex">${ex.length} exceso(s)${ex.some(e => e.nivel === 'critico') ? ' · crítico' : ''}</span>`);
    return etiquetas.join('') || '<span class="sub">—</span>';
  }

  // ── Puntos de control: planilla de vueltas por bus ──
  function pintarPasos() {
    const cont = document.getElementById('panel-pasos');
    const grupos = datos?.grupos || [];
    if (!grupos.length) { cont.innerHTML = vacio(datos ? 'No hay posiciones GPS para ese filtro.' : 'Sin datos.'); return; }
    cont.innerHTML = grupos.map((g, gi) => {
      const puntos = (datos.puntos_ruta[g.ruta_id] || []).filter(p => p.tipo === 'control');
      let h = `<div class="card">${cabeceraGrupo(g, gi, ` · <b>${g.vueltas.length}</b> vuelta(s)`)}`;
      if (g.vueltas.length) {
        h += `<div class="planilla-wrap"><table class="planilla"><thead><tr><th>Vuelta</th><th>Salida</th>
          ${puntos.map(p => `<th title="${esc(p.nombre)}">${esc(p.alias || p.nombre)}
            <span class="obj">${p.minutos_objetivo != null ? p.minutos_objetivo + ' min' : 'sin obj.'}</span></th>`).join('')}
          <th>Llegada</th><th>Duración</th><th>Novedades</th></tr></thead><tbody>
          ${g.vueltas.map(v => `<tr class="${g.abandonos.some(a => a.vuelta === v.n && a.tipo !== 'encierro') ? 'con-abandono' : ''}">
            <td class="vta">${v.n}</td>
            <td class="celda"><span class="hora">${fmtHora(v.salida)}</span>
              <span class="sub">${esc(v.terminal_salida?.alias || '')}</span></td>
            ${puntos.map(p => {
              const c = v.pasos[p.id];
              return c ? `<td class="celda" title="${esc(p.nombre)} · ${fmtHora(c.paso, true)} · ${fmtMin(c.transcurrido_min)} desde la salida">
                  <span class="hora">${fmtHora(c.paso)}</span>${desvio(c.desvio_min)}</td>`
                : '<td class="no-paso" title="No registró paso">—</td>';
            }).join('')}
            <td class="celda">${v.llegada ? `<span class="hora">${fmtHora(v.llegada)}</span>${desvio(v.desvio_llegada_min)}`
              : '<span class="sub">sin llegada</span>'}</td>
            <td>${v.duracion_min != null ? fmtMin(Math.round(v.duracion_min)) : '—'}</td>
            <td class="novedades">${novedadesVuelta(g, gi, v.n)}</td>
          </tr>`).join('')}
          </tbody></table></div>
          <div class="leyenda"><span>Desvío frente a los minutos objetivo desde la salida del terminal:</span>
            ${desvio(2)} atraso ${desvio(-2)} adelanto ${desvio(0)} a tiempo</div>`;
      } else if (g.pasos.length) {
        h += `<div class="empty" style="padding:10px;">Sin vueltas completas (no se detectó salida de un terminal).</div>`;
      }
      if (g.pasos.length) {
        h += `<details ${g.vueltas.length ? '' : 'open'}><summary>Todos los pasos (${g.pasos.length})</summary>
          <div style="overflow-x:auto;"><table class="responsive"><thead><tr><th>Punto</th><th>Tipo</th><th>Sentido</th>
            <th>Entró</th><th>Salió</th><th>Vuelta</th><th>Desde la salida</th><th>Objetivo</th><th>Desvío</th></tr></thead><tbody>
          ${g.pasos.map(p => `<tr>
            <td data-label="Punto"><b>${esc(p.alias || '')}</b> ${esc(p.nombre)}</td>
            <td data-label="Tipo">${p.tipo === 'terminal' ? 'Terminal' : 'Control'}</td>
            <td data-label="Sentido">${TXT_SENTIDO[p.sentido_bus] || '—'}</td>
            <td data-label="Entró" class="hora">${fmtHora(p.entrada, true)}</td>
            <td data-label="Salió" class="hora">${fmtHora(p.salida, true)}</td>
            <td data-label="Vuelta">${p.tipo === 'terminal'
              ? [p.vuelta_llegada ? `llega V${p.vuelta_llegada}` : '', p.vuelta_salida ? `sale V${p.vuelta_salida}` : ''].filter(Boolean).join(' · ') || '—'
              : (p.vuelta ? 'V' + p.vuelta : '—')}</td>
            <td data-label="Desde la salida">${fmtMin(p.transcurrido_min)}</td>
            <td data-label="Objetivo">${p.tipo === 'control' && p.minutos_objetivo != null ? p.minutos_objetivo + ' min' : '—'}</td>
            <td data-label="Desvío">${desvio(p.desvio_min) || '—'}</td>
          </tr>`).join('')}</tbody></table></div></details>`;
      } else if (!g.avisos.length) {
        h += `<div class="empty" style="padding:10px;">El bus no pasó por ningún punto de control.</div>`;
      }
      return h + '</div>';
    }).join('');
  }

  // ── Excesos de velocidad ──
  function filtrarNivel(n) { filtroNivel = n; pintarExcesos(); }

  function pintarExcesos() {
    const cont = document.getElementById('panel-excesos');
    const todosEx = todos('excesos');
    if (!todosEx.length) { cont.innerHTML = vacio(datos?.grupos.length ? 'Sin excesos de velocidad. 👍' : 'Sin datos.'); return; }
    const lista = todosEx.filter(e => filtroNivel === 'todos' || e.nivel === filtroNivel);
    const n = k => todosEx.filter(e => e.nivel === k).length;
    cont.innerHTML = `<div class="filtros">
        ${[['todos', `Todos (${todosEx.length})`], ['critico', `Críticos (${n('critico')})`], ['aviso', `Aviso (${n('aviso')})`]]
          .map(([k, t]) => `<button class="chip ${filtroNivel === k ? 'on' : ''}" onclick="filtrarNivel('${k}')">${t}</button>`).join('')}
      </div>
      <div class="card" style="padding:6px 10px;"><div style="overflow-x:auto;"><table class="responsive">
      <thead><tr><th>Fecha</th><th>Bus</th><th>Hora</th><th>Duración</th><th>Vel. máx.</th><th>Límite</th><th>Nivel</th><th>Dónde</th><th></th></tr></thead>
      <tbody>${lista.map(e => `<tr>
        <td data-label="Fecha">${fmtFecha(e.g.fecha)}<div class="sub">${e.vuelta ? 'Vuelta ' + e.vuelta : 'Fuera de vuelta'}</div></td>
        <td data-label="Bus" class="bus"><b>${esc(busTxt(e.g))}</b><div class="sub">${esc(e.g.conductor || '')}</div></td>
        <td data-label="Hora" class="hora">${fmtHora(e.inicio, true)}</td>
        <td data-label="Duración">${e.posiciones > 1 ? `${fmtDur(e.duracion_s)}<div class="sub">${e.posiciones} reportes</div>`
          : '1 reporte'}</td>
        <td data-label="Vel. máx."><span class="vel">${fmtNum(e.vel_max)} km/h</span><div class="sub">+${fmtNum(e.exceso_kmh)} km/h</div></td>
        <td data-label="Límite">${e.limite_aviso} / ${e.limite_critico} km/h</td>
        <td data-label="Nivel"><span class="pill ${e.nivel}">${e.nivel === 'critico' ? 'Crítico' : 'Aviso'}</span></td>
        <td data-label="Dónde">${e.tramo ? esc(e.tramo) + ' · ' : ''}${e.en_ruta ? (TXT_SENTIDO[e.sentido] || 'En ruta') : (e.g.ruta_id ? 'Fuera de ruta' : 'Sin ruta')}
          <div class="sub">${esc(e.g.ruta_nombre || '')}</div></td>
        <td data-label=""><button class="btn ghost sm" onclick="verExceso(${e.gi}, ${e.i})">Mapa</button></td>
      </tr>`).join('')}</tbody></table></div></div>
      <div class="nota">Aviso: supera el primer límite de la ruta. Crítico: supera el segundo. Los límites se configuran
        por ruta en Rutas Geográficas.</div>`;
  }

  // ── Abandonos de ruta ──
  function pintarAbandonos() {

      cont.innerHTML = vacio(datos?.grupos.length ? 'Sin abandonos de ruta. 👍' : 'Sin datos.');

    cont.innerHTML = `<div class="card" style="padding:6px 10px;"><div style="overflow-x:auto;"><table class="responsive">
      <thead><tr><th>Fecha</th><th>Bus</th><th>Salió de la ruta</th><th>Duración</th><th>Distancia</th><th>Estado</th><th></th></tr></thead>
      <tbody>${lista.map(a => {

          : a.tipo === 'atajo' ? '<span class="pill abandono">Atajo</span>'
          : a.regreso ? '<span class="pill abandono">Abandono</span>' : '<span class="pill sinregreso">No regresó</span>';
        const saltado = a.saltado_m ? `<div class="sub">se saltó ${fmtKm(a.saltado_m)} de ruta</div>` : '';
        return `<tr class="${a.tipo === 'encierro' ? 'gris' : ''}">
        <td data-label="Fecha">${fmtFecha(a.g.fecha)}<div class="sub">${a.vuelta ? 'Vuelta ' + a.vuelta : 'Fuera de vuelta'}</div></td>
        <td data-label="Bus" class="bus"><b>${esc(busTxt(a.g))}</b><div class="sub">${esc(a.g.conductor || '')}</div></td>
        <td data-label="Salió de la ruta"><span class="hora">${fmtHora(a.inicio, true)}</span>
          <div class="sub">${a.fin ? 'regresó ' + fmtHora(a.fin, true) : 'no regresó'}</div></td>
        <td data-label="Duración">${fmtDur(a.duracion_s)}</td>
        <td data-label="Distancia">${a.tipo === 'atajo' && !a.distancia_max_m ? `${fmtNum(a.km_fuera, 2)} km por fuera`
            : `hasta ${fmtNum(a.distancia_max_m)} m de la ruta<div class="sub">${fmtNum(a.km_fuera, 2)} km por fuera</div>`}</td>
        <td data-label="Estado">${est}${saltado}</td>
        <td data-label=""><button class="btn ghost sm" onclick="verAbandono(${a.gi}, ${a.i})">Mapa</button></td>
      </tr>`; }).join('')}</tbody></table></div></div>
      <div class="nota">Cuenta desde que el bus entra a la ruta en el día (antes viene del patio). <b>Abandono</b>: fuera
        del corredor de la ruta (${datos.grupos[0]?.limites.corredor_m ?? 50} m) por varios reportes seguidos. <b>Atajo</b>: se siguió
        derecho y se saltó un tramo de la ruta, aunque no se haya alejado. Si un bus termina en un patio o parqueadero, crea esa
        zona de encierro en Rutas Geográficas y quedará como "Fue a encierro".</div>`;
  }

  // ── Resumen por bus ──
  function pintarResumen() {

    cont.innerHTML = `<div class="card" style="padding:6px 10px;"><div style="overflow-x:auto;"><table class="responsive">
      <thead><tr><th>Fecha</th><th>Bus</th><th>Ruta</th><th>Conductor</th><th>GPS</th><th>Km</th><th>Vel. máx.</th>
        <th>Vueltas</th><th>Excesos</th><th>Abandonos</th><th></th></tr></thead>
      <tbody>${grupos.map((g, gi) => `<tr>
        <td data-label="Fecha">${fmtFecha(g.fecha)}</td>
        <td data-label="Bus" class="bus"><b>${esc(busTxt(g))}</b><div class="sub">${esc(g.placa || '')}</div></td>
        <td data-label="Ruta">${esc(g.ruta_nombre || 'Sin ruta')}</td>
        <td data-label="Conductor">${esc(g.conductor || '—')}</td>

        <td data-label="Km">${fmtNum(g.resumen.km, 1)}</td>
        <td data-label="Vel. máx.">${g.resumen.vel_max != null ? fmtNum(g.resumen.vel_max) + ' km/h' : '—'}</td>
        <td data-label="Vueltas">${g.vueltas.length}</td>
        <td data-label="Excesos">${g.excesos.length}${g.excesos.some(e => e.nivel === 'critico') ? ' <span class="pill critico">crítico</span>' : ''}</td>
        <td data-label="Abandonos">${g.abandonos.filter(a => a.tipo !== 'encierro').length}</td>
        <td data-label=""><button class="btn ghost sm" onclick="verDia(${gi})">Ver recorrido</button></td>
      </tr>`).join('')}</tbody></table></div></div>`;

  // ══════════════════════════════════════════
  //  Mapa del recorrido
  // ══════════════════════════════════════════
  let mapa = null, capaMapa = null;
  const geometrias = {};   // ruta_id → {trazados, puntos}

  // ── Mapa base: Google (si hay clave, igual que el mapa en vivo) con Esri de respaldo ──
  // Google cobra por cada mapa creado: se crea una sola vez y se reutiliza.
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services';
  const ESTILOS = {
    calles:   { google: 'roadmap', esri: `${ESRI}/World_Street_Map/MapServer/tile/{z}/{y}/{x}`,
                attr: '&copy; Esri, HERE, Garmin, OpenStreetMap' },
    satelite: { google: 'hybrid', esri: `${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`,
                attr: '&copy; Esri, Maxar, Earthstar Geographics' },
  };
  const GOOGLE_MUTANT = { src: 'https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js',
                          integrity: 'sha384-NVeApJLhFaaKalRqZ2xBNeRECGMKMkF5VMTDJtXWk2g0Tq+5Jo1N7CZjhL3gQSFW' };
  let usarGoogle = false, googleListo = null, capaBase = null, estiloMapa = 'calles';
  const capasBase = {};

  function cargarScript(src, integrity) {
    return new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      if (integrity) { s.integrity = integrity; s.crossOrigin = 'anonymous'; }
      s.onload = ok; s.onerror = () => mal(new Error('No cargó ' + src));
      document.head.appendChild(s);
    });
  }

  // Se llama al abrir la página: así el script ya está listo cuando se abra un mapa.
  function prepararGoogle() {
    googleListo = (async () => {
      const cfg = await apiFetch('/api/monitoreo/mapa-config');
      if (!cfg.google_maps_key) return;
      window.gm_authFailure = () => {   // clave rechazada: volver a Esri
        console.warn('Google Maps rechazó la clave; se usa el mapa alterno.');
        usarGoogle = false;
        Object.keys(capasBase).forEach(k => delete capasBase[k]);
        if (mapa) setEstiloMapa(estiloMapa);
      };
      await new Promise((ok, mal) => {
        window.__gmListo = ok;
        cargarScript(`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(cfg.google_maps_key)}` +
                     `&v=weekly&language=es&region=CO&loading=async&callback=__gmListo`).catch(mal);
      });
      if (google.maps.importLibrary) await google.maps.importLibrary('maps');
      await cargarScript(GOOGLE_MUTANT.src, GOOGLE_MUTANT.integrity);
      usarGoogle = true;
    })().catch(e => console.warn('Mapa de Google no disponible:', e.message));
  }

  function setEstiloMapa(k) {
    estiloMapa = k;
    if (capaBase) mapa.removeLayer(capaBase);
    const s = ESTILOS[k];
    capaBase = capasBase[k] || (capasBase[k] = usarGoogle
      ? L.gridLayer.googleMutant({ type: s.google, maxZoom: 21 })
      : L.tileLayer(s.esri, { maxZoom: 20, maxNativeZoom: 19, attribution: s.attr }));
    capaBase.addTo(mapa);
    if (capaBase.bringToBack) capaBase.bringToBack();
    document.querySelectorAll('#estilosMapa button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  }

  async function crearMapa() {
    mapa = L.map('mapaRep', { zoomControl: true }).setView([6.25, -75.57], 13);
    capaMapa = L.layerGroup().addTo(mapa);
    // Espera breve por Google; si tarda o falla, arranca con Esri.
    await Promise.race([googleListo, new Promise(r => setTimeout(r, 4000))]);
    setEstiloMapa(estiloMapa);
  }
  function cerrarMapa() { document.getElementById('mapaModal').classList.add('hidden'); }

  async function geometria(rutaId) {
    if (!rutaId) return null;
    if (!(rutaId in geometrias)) {
      try { geometrias[rutaId] = (await apiFetch(`/api/monitoreo/rutas/geometria?ruta_id=${rutaId}`))[0] || null; }
      catch { geometrias[rutaId] = null; }
    }
    return geometrias[rutaId];
  }

  const isoMas = (iso, seg) => new Date(new Date(iso).getTime() + seg * 1000).toISOString().replace(/\.\d+Z$/, 'Z');
  const marca = (color, tip) => L.divIcon({ className: '', iconSize: [14, 14], iconAnchor: [7, 7],
    html: `<div class="mk" style="background:${color}" title="${esc(tip)}"></div>` });

  // resaltes: [{desde, hasta}] (ISO, hasta excluido) — tramos del recorrido que se pintan en rojo.
  async function abrirMapa({ g, titulo, info, desde, hasta, resaltes = [], marcas = [], todoElDia = false }) {
    document.getElementById('mapaTitulo').textContent = titulo;
    document.getElementById('mapaInfo').innerHTML = info;
    document.getElementById('mapaModal').classList.remove('hidden');
    if (!mapa) await crearMapa();
    setTimeout(() => mapa.invalidateSize(), 50);
    capaMapa.clearLayers();
    let pos, geo;
    try {
      [pos, geo] = await Promise.all([
        apiFetch(`/api/monitoreo/reportes/recorrido?bus_id=${g.bus_id}&desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}`),
        geometria(g.ruta_id),
      ]);
    } catch (e) { toast(e.message); return; }
    const limites = [];
    if (geo) {
      [['ida', '#2563eb', null], ['regreso', '#ea580c', '9 7']].forEach(([s, color, dash]) => {
        const l = geo.trazados[s]?.puntos;
        if (!l) return;
        L.polyline(l, { color: '#fff', weight: 7, opacity: .7, interactive: false }).addTo(capaMapa);
        L.polyline(l, { color, weight: 4, opacity: .75, dashArray: dash }).bindTooltip(`Ruta — ${s === 'ida' ? 'Ida (bajando)' : 'Regreso (subiendo)'}`, { sticky: true }).addTo(capaMapa);
      });
      geo.puntos.forEach(p => {
        L.circle([p.lat, p.lon], { radius: p.radio_m, color: '#7c3aed', weight: 1, fillOpacity: .06, interactive: false }).addTo(capaMapa);
        L.marker([p.lat, p.lon], { icon: L.divIcon({ className: '', iconSize: [24, 24], iconAnchor: [12, 12],
          html: `<div class="pc-mk ${p.tipo === 'terminal' ? 'terminal' : ''}">${esc((p.alias || '').slice(0, 4))}</div>` }) })
          .bindTooltip(`${esc(p.nombre)}${p.minutos_objetivo != null ? ` · ${p.minutos_objetivo} min` : ''}`).addTo(capaMapa);
      });
    }
    if (!pos.length) { toast('No hay posiciones en ese intervalo'); return; }
    // Recorrido partido en tramos normales y resaltados.
    const resaltado = t => resaltes.some(r => t >= r.desde && t < r.hasta);
    let tramo = [], enRes = null;
    const cerrarTramo = () => {
      if (tramo.length > 1) L.polyline(tramo, { color: enRes ? '#dc2626' : '#6366f1', weight: enRes ? 5 : 4, opacity: .9 }).addTo(capaMapa);
    };
    pos.forEach(p => {
      const r = resaltado(p.t);
      const ll = [p.lat, p.lon];
      limites.push(ll);
      if (enRes !== null && r !== enRes) { tramo.push(ll); cerrarTramo(); tramo = [tramo[tramo.length - 1]]; }
      enRes = r;
      tramo.push(ll);
      L.circleMarker(ll, { radius: 2.5, color: r ? '#dc2626' : '#6366f1', weight: 1, fillOpacity: .8 })
        .bindTooltip(`${fmtHora(p.t, true)} · ${p.vel != null ? Math.round(p.vel) + ' km/h' : ''}`).addTo(capaMapa);
    });
    cerrarTramo();
    L.marker([pos[0].lat, pos[0].lon], { icon: marca('#16a34a', 'Inicio') }).bindTooltip(`Inicio ${fmtHora(pos[0].t, true)}`).addTo(capaMapa);
    const ult = pos[pos.length - 1];
    L.marker([ult.lat, ult.lon], { icon: marca('#111', 'Fin') }).bindTooltip(`Fin ${fmtHora(ult.t, true)}`).addTo(capaMapa);
    marcas.forEach(m => L.marker([m.lat, m.lon], { icon: marca('#dc2626', m.tip), zIndexOffset: 1000 })
      .bindTooltip(m.tip, { permanent: true, direction: 'top', offset: [0, -8] }).addTo(capaMapa));
    const enfoque = !todoElDia && pos.some(p => resaltado(p.t))
      ? pos.filter(p => resaltado(p.t)).map(p => [p.lat, p.lon]) : limites;
    mapa.fitBounds(L.latLngBounds(enfoque).pad(enfoque === limites ? .08 : .6), { maxZoom: 17 });
  }

  function verExceso(gi, i) {
    const g = datos.grupos[gi], e = g.excesos[i];
    abrirMapa({
      g, titulo: `${busTxt(g)} — exceso de velocidad`,
      info: `${fmtFecha(g.fecha)} · ${fmtHora(e.inicio, true)} · máx. <b>${fmtNum(e.vel_max)} km/h</b> (límite ${e.limite_aviso} / ${e.limite_critico}) · ${e.nivel === 'critico' ? 'Crítico' : 'Aviso'}`,
      desde: isoMas(e.inicio, -240), hasta: isoMas(e.fin, 240),
      resaltes: [{ desde: e.inicio, hasta: isoMas(e.fin, 1) }],
      marcas: [{ lat: e.lat, lon: e.lon, tip: `${fmtNum(e.vel_max)} km/h` }],
    });
  }

  // Tramo a resaltar: en un atajo incluye la posición de regreso (también sobre la ruta).
  function resalteAbandono(a, ultima) {
    return { desde: a.inicio, hasta: a.tipo === 'atajo' ? isoMas(a.fin, 1) : (a.fin || isoMas(ultima, 1)) };
  }

  function verAbandono(gi, i) {
    const g = datos.grupos[gi], a = g.abandonos[i];
    const fin = a.fin || isoMas(a.inicio, a.duracion_s + 1);
    const atajo = a.tipo === 'atajo';
    abrirMapa({
      g, titulo: `${busTxt(g)} — ${a.tipo === 'encierro' ? 'ida a encierro' : atajo ? 'atajo: se siguió derecho' : 'abandono de ruta'}`,
      info: atajo
        ? `${fmtFecha(g.fecha)} · ${fmtHora(a.inicio, true)} a ${fmtHora(a.fin, true)} · se saltó <b>${fmtKm(a.saltado_m)}</b> de ruta
           y recorrió ${fmtKm(a.km_fuera * 1000)} por fuera`
        : `${fmtFecha(g.fecha)} · salió ${fmtHora(a.inicio, true)} · ${a.fin ? 'regresó ' + fmtHora(a.fin, true) : 'no regresó'} ·
           ${fmtDur(a.duracion_s)} · hasta <b>${fmtNum(a.distancia_max_m)} m</b> de la ruta · ${fmtNum(a.km_fuera, 2)} km fuera
           ${a.saltado_m ? ` · se saltó <b>${fmtKm(a.saltado_m)}</b> de ruta` : ''}`,
      desde: isoMas(a.inicio, -360), hasta: isoMas(fin, 360),
      resaltes: [resalteAbandono(a, fin)],
      marcas: atajo ? [] : [{ lat: a.max_lat, lon: a.max_lon, tip: `${fmtNum(a.distancia_max_m)} m de la ruta` }],
    });
  }

  function verDia(gi) {
    const g = datos.grupos[gi];
    abrirMapa({
      g, titulo: `${busTxt(g)} — recorrido del ${fmtFecha(g.fecha)}`,
      info: `${esc(g.ruta_nombre || 'Sin ruta')} · ${fmtNum(g.resumen.km, 1)} km · ${g.vueltas.length} vuelta(s) ·
        en rojo los abandonos de ruta; los puntos rojos marcan excesos de velocidad`,
      desde: g.resumen.primera, hasta: isoMas(g.resumen.ultima, 1),
      resaltes: g.abandonos.filter(a => a.tipo !== 'encierro').map(a => resalteAbandono(a, g.resumen.ultima)),
      marcas: g.excesos.map(e => ({ lat: e.lat, lon: e.lon, tip: `${fmtNum(e.vel_max)} km/h` })),
      todoElDia: true,
    });
  }

  // ══════════════════════════════════════════
  //  Excel (Administrador)
  // ══════════════════════════════════════════
  const _libs = {};
  function cargarLibreria(src) {
    if (!_libs[src]) {
      _libs[src] = new Promise((ok, fail) => {
        const s = document.createElement('script');
        s.src = src; s.onload = ok;
        s.onerror = () => { delete _libs[src]; fail(new Error('No se pudo descargar la librería. Revisa tu conexión.')); };
        document.head.appendChild(s);
      });
    }
    return _libs[src];
  }

  function hoja(wb, nombre, titulo, columnas, filas, periodo) {
    const AZUL = 'FF06B6D4', bf = { style: 'thin', color: { argb: 'FFD9D9E8' } };
    const bordes = { top: bf, left: bf, bottom: bf, right: bf };
    const ws = wb.addWorksheet(nombre, { views: [{ state: 'frozen', ySplit: 5 }] });
    ws.columns = columnas.map(c => ({ width: c.w }));
    const ultima = String.fromCharCode(64 + columnas.length);
    [1, 2, 3].forEach(r => ws.getRow(r).height = 22);
    ws.mergeCells('A1:A3');
    if (window.LOGO_MILAGROSA) {
      try {
        ws.addImage(wb.addImage({ base64: window.LOGO_MILAGROSA.split(',')[1], extension: 'jpeg' }),
                    { tl: { col: 0, row: 0 }, ext: { width: 130, height: 95 } });
      } catch (e) { /* sin logo si falla */ }
    }
    const encabezado = (celda, value, font) => {
      ws.mergeCells(`B${celda}:${ultima}${celda}`);
      Object.assign(ws.getCell(`B${celda}`), { value, font, alignment: { horizontal: 'right', vertical: 'middle' } });
    };
    encabezado(1, titulo, { bold: true, size: 15, color: { argb: AZUL } });
    encabezado(2, `Flota la Milagrosa   ·   Período: ${periodo}   ·   Registros: ${filas.length}`, { size: 11, color: { argb: 'FF555566' } });
    encabezado(3, `Generado: ${new Date().toLocaleString('es-CO')}`, { size: 10, italic: true, color: { argb: 'FF888899' } });
    ws.getRow(4).height = 6;
    const hr = ws.getRow(5);
    hr.values = columnas.map(c => c.h);
    hr.height = 22;
    hr.eachCell(c => {
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: AZUL } };
      c.font = { bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
      c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      c.border = bordes;
    });
    filas.forEach(f => {
      const r = ws.addRow(columnas.map(c => c.v(f)));
      r.eachCell({ includeEmpty: true }, c => { c.border = bordes; c.alignment = { vertical: 'middle' }; c.font = { size: 10 }; });
    });
  }

  async function exportarExcel() {
    if (!datos?.grupos.length) { toast('No hay datos para exportar'); return; }
    const btn = document.getElementById('excelBtn');
    btn.disabled = true; btn.textContent = 'Generando…';
    try {
      await cargarLibreria(LIB_EXCELJS);
      const periodo = datos.fecha === datos.fecha_fin ? fmtFecha(datos.fecha) : `${fmtFecha(datos.fecha)} a ${fmtFecha(datos.fecha_fin)}`;
      const base = [
        { h: 'Fecha', w: 12, v: x => fmtFecha(x.g.fecha) },
        { h: 'Bus', w: 9, v: x => x.g.numero ?? '' },
        { h: 'Placa', w: 10, v: x => x.g.placa || '' },
        { h: 'Ruta', w: 20, v: x => x.g.ruta_nombre || 'Sin ruta' },
        { h: 'Conductor', w: 24, v: x => x.g.conductor || '' },
      ];
      const wb = new ExcelJS.Workbook();
      wb.creator = 'Flota la Milagrosa';
      hoja(wb, 'Puntos de control', 'PASOS POR PUNTOS DE CONTROL', [...base,
        { h: 'Vuelta', w: 13, v: p => p.tipo === 'terminal'
            ? [p.vuelta_llegada ? `Llega V${p.vuelta_llegada}` : '', p.vuelta_salida ? `Sale V${p.vuelta_salida}` : ''].filter(Boolean).join(' / ')
            : (p.vuelta ? `V${p.vuelta}` : '') },
        { h: 'Punto', w: 9, v: p => p.alias || '' },
        { h: 'Nombre del punto', w: 26, v: p => p.nombre },
        { h: 'Tipo', w: 10, v: p => p.tipo === 'terminal' ? 'Terminal' : 'Control' },
        { h: 'Sentido', w: 10, v: p => TXT_SENTIDO[p.sentido_bus] || '' },
        { h: 'Entró', w: 10, v: p => fmtHora(p.entrada, true) },
        { h: 'Salió', w: 10, v: p => fmtHora(p.salida, true) },
        { h: 'Min. desde salida', w: 11, v: p => p.transcurrido_min ?? '' },
        { h: 'Min. objetivo', w: 10, v: p => p.tipo === 'control' ? (p.minutos_objetivo ?? '') : '' },
        { h: 'Desvío (min)', w: 10, v: p => txtDesvio(p.desvio_min) },
      ], todos('pasos'), periodo);
      hoja(wb, 'Vueltas', 'VUELTAS POR BUS', [...base,
        { h: 'Vuelta', w: 8, v: v => v.n },
        { h: 'Salida', w: 10, v: v => fmtHora(v.salida, true) },
        { h: 'Terminal salida', w: 18, v: v => v.terminal_salida?.nombre || '' },
        { h: 'Llegada', w: 10, v: v => v.llegada ? fmtHora(v.llegada, true) : 'Sin llegada' },
        { h: 'Terminal llegada', w: 18, v: v => v.terminal_llegada?.nombre || '' },
        { h: 'Duración (min)', w: 10, v: v => v.duracion_min ?? '' },
        { h: 'Objetivo (min)', w: 10, v: v => v.objetivo_llegada_min ?? '' },
        { h: 'Desvío llegada', w: 10, v: v => txtDesvio(v.desvio_llegada_min) },
      ], todos('vueltas'), periodo);
      hoja(wb, 'Excesos', 'EXCESOS DE VELOCIDAD', [...base,
        { h: 'Vuelta', w: 8, v: x => x.vuelta ?? '' },
        { h: 'Inicio', w: 10, v: e => fmtHora(e.inicio, true) },
        { h: 'Fin', w: 10, v: e => fmtHora(e.fin, true) },
        { h: 'Reportes', w: 9, v: e => e.posiciones },
        { h: 'Vel. máx. (km/h)', w: 11, v: e => e.vel_max },
        { h: 'Límite aviso', w: 9, v: e => e.limite_aviso },
        { h: 'Límite crítico', w: 9, v: e => e.limite_critico },
        { h: 'Nivel', w: 9, v: e => e.nivel === 'critico' ? 'Crítico' : 'Aviso' },
        { h: 'Dónde', w: 16, v: e => (e.tramo ? e.tramo + ' · ' : '') + (e.en_ruta ? (TXT_SENTIDO[e.sentido] || 'En ruta') : 'Fuera de ruta') },
        { h: 'Ubicación', w: 24, v: e => `${e.lat.toFixed(6)}, ${e.lon.toFixed(6)}` },
      ], todos('excesos'), periodo);
      hoja(wb, 'Abandonos', 'ABANDONOS DE RUTA', [...base,
        { h: 'Vuelta', w: 8, v: x => x.vuelta ?? '' },
        { h: 'Salió de la ruta', w: 11, v: a => fmtHora(a.inicio, true) },
        { h: 'Regresó', w: 10, v: a => a.fin ? fmtHora(a.fin, true) : 'No regresó' },
        { h: 'Duración (min)', w: 10, v: a => Math.round(a.duracion_s / 6) / 10 },
        { h: 'Distancia máx. (m)', w: 11, v: a => a.distancia_max_m },
        { h: 'Km fuera', w: 9, v: a => a.km_fuera },
        { h: 'Estado', w: 20, v: a => a.tipo === 'encierro' ? `Encierro${a.encierro ? ': ' + a.encierro : ''}`
            : a.tipo === 'atajo' ? 'Atajo' : (a.regreso ? 'Abandono' : 'No regresó') },
        { h: 'Tramo saltado (m)', w: 11, v: a => a.saltado_m ?? '' },
        { h: 'Ubicación (más lejos)', w: 24, v: a => `${a.max_lat.toFixed(6)}, ${a.max_lon.toFixed(6)}` },
      ], todos('abandonos'), periodo);

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `reportes_recorrido_${datos.fecha}${datos.fecha_fin !== datos.fecha ? '_a_' + datos.fecha_fin : ''}.xlsx`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Excel generado');
    } catch (e) {
      toast('No se pudo generar el Excel');
    } finally {
      btn.disabled = false; btn.textContent = 'Exportar Excel';
    }
  }

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
  }
</script>
