name: App móvil (Flutter)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # APK de prueba (firmado con la clave debug): sirve para instalar
      # directo en un celular Android, no para la Play Store.
      # Mapa en vivo con Google Maps si existe el secreto GOOGLE_MAPS_API_KEY
      # (Settings → Secrets and variables → Actions); sin él usa Esri.
      - run: flutter build apk --release --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: buscontrol-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
