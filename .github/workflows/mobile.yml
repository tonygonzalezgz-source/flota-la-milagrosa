name: App móvil (Flutter)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Clave de subida a Google Play (secretos ANDROID_*). Sin ella, el APK se
      # firma con la clave debug y no se arma el paquete para la Play Store.
      - name: Preparar firma de subida
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/buscontrol-subida.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/buscontrol-subida.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave de subida: no se arma el AAB para Google Play"
          fi

      # Número de compilación = número de ejecución del workflow: cada envío a
      # Google Play necesita uno mayor que el anterior.
      # Mapa en vivo con Google Maps si existe GOOGLE_MAPS_API_KEY en
      # Settings → Secrets and variables → Actions (como secreto o como
      # variable); sin ella usa Esri.
      - name: APK de prueba (instalar directo en un celular)
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: AAB firmado para Google Play
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: buscontrol-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_PATH != ''
        with:
          name: buscontrol-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
