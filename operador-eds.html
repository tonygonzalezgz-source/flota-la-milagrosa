<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Milagrosa — Operador EDS</title>
  <script>
    (function(){
      document.addEventListener('contextmenu',function(e){e.preventDefault();});
      document.addEventListener('keydown',function(e){
        if(e.key==='F12'){e.preventDefault();return false;}
        if(e.ctrlKey&&e.shiftKey&&['I','J','C','U'].includes(e.key.toUpperCase())){e.preventDefault();return false;}
        if(e.ctrlKey&&e.key.toUpperCase()==='U'){e.preventDefault();return false;}
      });
    })();
  </script>
  <script>
    (function() {
      if (window.location === window.parent.location) {
        const token = localStorage.getItem('authToken');
        if (!token) { window.location.href = '/index.html'; }
      }
    })();
  </script>
  <!-- jsPDF se carga bajo demanda al generar el PDF; ver cargarLibreria() -->
  <style>
    :root{
      --bg:#f1f2f6; --surface:#fff; --border:#e5e5eb;
      --blue:#6366f1; --green:#22c55e; --yellow:#f59e0b; --red:#ef4444; --cyan:#06b6d4; --purple:#a855f7;
      --text:#111; --muted:#6b7280;
      --radius:14px; --radius-sm:10px;
      --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{-webkit-text-size-adjust:100%;}
    img,svg,video{max-width:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg); color:var(--text);
      padding:20px; padding-top:24px;
    }
    .wrap{max-width:1040px;margin:0 auto;}
    .page-head{margin-bottom:20px;}
    .page-head h1{font-size:1.4rem;font-weight:700;display:flex;align-items:center;gap:10px;}
    .page-head p{color:var(--muted);font-size:.9rem;margin-top:4px;}
    .page-head .ico{color:var(--green);display:inline-flex;}

    /* ── CRONOGRAMA SEMANAL ── */
    .crono-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
    .crono-day{
      border:1px solid var(--border);border-radius:var(--radius-sm);
      background:#fafafb;padding:10px 6px;text-align:center;
    }
    .crono-day .dia{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;}
    .crono-day .act{font-size:.72rem;font-weight:600;line-height:1.3;}
    .crono-day .act + .act{margin-top:5px;padding-top:5px;border-top:1px dashed var(--border);}
    .crono-day .act.patio    {color:#16a34a;}
    .crono-day .act.canaletas{color:#7c3aed;}
    .crono-day .act.estacion {color:#0891b2;}
    .crono-day .act.grasa    {color:#b45309;}
    .crono-day.hoy{
      border-color:var(--green);background:#f0fdf4;
      box-shadow:0 0 0 3px rgba(34,197,94,.12);
    }
    .crono-day.hoy .dia{color:var(--green);}
    .crono-hoy-banner{
      margin-top:14px;display:flex;align-items:center;gap:10px;
      background:#f0fdf4;border:1px solid rgba(34,197,94,.35);border-radius:var(--radius-sm);
      padding:12px 14px;font-size:.9rem;
    }
    .crono-hoy-banner svg{color:var(--green);flex-shrink:0;}
    .crono-hoy-banner b{color:#15803d;}

    /* ── TABS ── */
    .area-tabs{display:flex;gap:10px;margin-bottom:20px;}
    .area-tab{
      flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 16px;border:1px solid var(--border);border-radius:var(--radius);
      background:var(--surface);cursor:pointer;font-size:.95rem;font-weight:650;color:var(--muted);
      transition:all .15s;box-shadow:var(--shadow);
    }
    .area-tab svg{flex-shrink:0;}
    .area-tab.active{border-color:var(--green);color:#16a34a;background:#f0fdf4;box-shadow:0 0 0 3px rgba(34,197,94,.12);}
    .area-tab.active.tab-nov{border-color:var(--yellow);color:#b45309;background:#fffbeb;box-shadow:0 0 0 3px rgba(245,158,11,.12);}

    .card{
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); box-shadow:var(--shadow);
      padding:20px; margin-bottom:20px;
    }
    .card h2{font-size:1.05rem;font-weight:650;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .card h2 .badge{font-size:.68rem;font-weight:600;background:rgba(34,197,94,.1);color:#16a34a;padding:2px 8px;border-radius:20px;}

    /* ── FORM ── */
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
    .field{display:flex;flex-direction:column;gap:6px;}
    .field.full{grid-column:1/-1;}
    label{font-size:.82rem;font-weight:600;color:#374151;}
    input,select,textarea{
      font-family:inherit;font-size:.95rem;color:var(--text);
      background:#fafafb;border:1px solid var(--border);border-radius:var(--radius-sm);
      padding:11px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;
    }
    input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(99,102,241,.12);}
    textarea{resize:vertical;min-height:70px;}
    .tipo-hint{font-size:.76rem;color:var(--muted);font-weight:500;}

    /* ── FOTOS ── */
    .comp-btns{display:flex;gap:12px;flex-wrap:wrap;}
    .comp-btn{
      position:relative;overflow:hidden;
      flex:1;min-width:140px;display:flex;flex-direction:column;align-items:center;gap:8px;
      padding:18px 12px;border:2px dashed var(--border);border-radius:var(--radius);
      background:#fafafb;cursor:pointer;transition:all .15s;text-align:center;
    }
    /* El input cubre todo el botón con opacity 0: al tocarlo directamente,
       los navegadores móviles respetan `capture` y abren la cámara.
       (Un input display:none/hidden hace que varios ignoren `capture`.) */
    .comp-btn input[type=file]{
      position:absolute;top:0;left:0;right:0;bottom:0;
      opacity:0;cursor:pointer;font-size:0;
    }
    .comp-btn:hover{border-color:var(--green);background:#f0fdf4;}
    .comp-btn svg{color:var(--green);}
    .comp-btn span{font-size:.85rem;font-weight:600;color:#374151;}
    .comp-btn small{font-size:.72rem;color:var(--muted);font-weight:500;}
    .fotos-grid{display:none;margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
    .fotos-grid.show{display:grid;}
    .foto-thumb{position:relative;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:#fafafb;}
    .foto-thumb img{display:block;width:100%;height:96px;object-fit:cover;}
    .foto-thumb .rm{
      position:absolute;top:4px;right:4px;width:24px;height:24px;
      background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;
      font-size:.9rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .fotos-count{font-size:.76rem;color:var(--muted);font-weight:500;margin-top:8px;}

    .btn-primary{
      background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);
      padding:13px 22px;font-size:.95rem;font-weight:650;cursor:pointer;
      transition:background .15s,transform .1s;width:100%;margin-top:4px;
    }
    .btn-primary:hover{background:#4f52d6;}
    .btn-primary:active{transform:scale(.99);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
    .btn-primary.ok{background:var(--green);}

    /* ── LISTADO ── */
    .list-tools{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
    .search{flex:1;min-width:180px;position:relative;}
    .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);}
    .search input{padding-left:38px;}
    .filter-sel{max-width:220px;}
    .date-range{display:flex;align-items:center;gap:6px;}
    .date-range input{max-width:150px;}
    .date-range span{color:var(--muted);font-size:.82rem;}

    .btn-pdf{
      display:inline-flex;align-items:center;gap:8px;margin-left:auto;
      background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);
      padding:10px 16px;font-size:.86rem;font-weight:650;cursor:pointer;transition:background .15s;
    }
    .btn-pdf:hover{background:#dc2626;}
    .btn-pdf:disabled{opacity:.6;cursor:not-allowed;}

    table{width:100%;border-collapse:collapse;font-size:.9rem;}
    thead th{
      text-align:left;font-size:.74rem;font-weight:600;text-transform:uppercase;
      letter-spacing:.03em;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--border);
    }
    tbody td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
    tbody tr:last-child td{border-bottom:none;}
    .tipo-pill{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:20px;}
    .tipo-pill.aseo_patio{background:rgba(34,197,94,.1);color:#16a34a;}
    .tipo-pill.canaletas{background:rgba(168,85,247,.12);color:#7c3aed;}
    .tipo-pill.aseo_estacion{background:rgba(6,182,212,.1);color:#0891b2;}
    .tipo-pill.trampa_grasa{background:rgba(245,158,11,.12);color:#b45309;}
    .tipo-pill.novedad{background:rgba(239,68,68,.1);color:#dc2626;}
    .desc-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151;}
    .btn-sm{font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;transition:all .15s;}
    .btn-sm.ver{color:var(--blue);border-color:rgba(99,102,241,.3);}
    .btn-sm.ver:hover{background:rgba(99,102,241,.08);}
    .btn-sm.del{color:var(--red);border-color:rgba(239,68,68,.3);}
    .btn-sm.del:hover{background:rgba(239,68,68,.08);}
    .no-comp{color:var(--muted);font-size:.8rem;}
    .empty{text-align:center;padding:40px 20px;color:var(--muted);}
    .empty svg{color:#d1d5db;margin-bottom:12px;}

    /* ── MODAL ── */
    .modal-bg{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
      z-index:1000;align-items:center;justify-content:center;padding:20px;
    }
    .modal-bg.show{display:flex;}
    .modal{
      background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;
      max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
    }
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
    .modal-head h3{font-size:1rem;font-weight:650;}
    .modal-head .x{background:none;border:none;font-size:1.4rem;color:var(--muted);cursor:pointer;line-height:1;}
    .modal-body{padding:20px;overflow:auto;text-align:center;}
    .modal-body img{border-radius:8px;margin-bottom:14px;}
    .modal-body img:last-child{margin-bottom:0;}
    .modal-body .m-info{text-align:left;background:#fafafb;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;font-size:.88rem;}
    .modal-body .m-info div{margin-bottom:4px;}
    .modal-body .m-info div:last-child{margin-bottom:0;}
    .modal-body .m-info b{color:#374151;}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);
      background:var(--text);color:#fff;padding:13px 22px;border-radius:var(--radius-sm);
      font-size:.9rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:1100;
      transition:transform .3s cubic-bezier(.2,.8,.3,1);
    }
    .toast.show{transform:translateX(-50%) translateY(0);}
    .toast.err{background:var(--red);}

    /* ── RESPONSIVE (tarjetas apiladas) ── */
    @media (max-width:720px){
      body{padding:14px;padding-top:64px;} /* deja libre el botón de menú flotante de la shell */
      .form-grid{grid-template-columns:1fr;}
      .crono-grid{grid-template-columns:repeat(4,1fr);}
      .date-range{width:100%;}
      .date-range input{max-width:none;flex:1;}
      .btn-pdf{margin-left:0;width:100%;justify-content:center;}
      thead{display:none;}
      table,tbody,tr,td{display:block;width:100%;}
      tbody tr{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:12px;padding:6px 4px;background:#fafafb;}
      tbody td{border:none;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
      tbody td::before{content:attr(data-label);font-size:.74rem;font-weight:600;text-transform:uppercase;color:var(--muted);}
      tbody td.acciones{justify-content:flex-end;gap:8px;}
      tbody td.acciones::before{display:none;}
      .desc-cell{max-width:none;white-space:normal;text-align:right;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <h1>
        <span class="ico">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 22v-8l9-4 9 4v8"/><path d="M12 10V2"/><path d="M9 2h6"/><path d="M7 22v-5h10v5"/></svg>
        </span>
        Operador EDS
      </h1>
      <p>Aseo de la estación de servicio según el cronograma semanal, y reporte de novedades con fotos.</p>
    </div>

    <!-- ── CRONOGRAMA SEMANAL ── -->
    <div class="card">
      <h2>Cronograma semanal <span class="badge">Fijo</span></h2>
      <div class="crono-grid" id="cronoGrid"></div>
      <div class="crono-hoy-banner" id="cronoHoy"></div>
    </div>

    <!-- ── TABS ── -->
    <div class="area-tabs">
      <button class="area-tab active" id="tab-aseo" onclick="setArea('aseo')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Actividades de aseo
      </button>
      <button class="area-tab tab-nov" id="tab-novedades" onclick="setArea('novedades')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Novedades del día
      </button>
    </div>

    <!-- ── REGISTRAR ── -->
    <div class="card" id="formCard">
      <h2 id="formTitle">Registrar actividad <span class="badge" id="formBadge">Aseo</span></h2>
      <form id="edsForm">
        <div class="form-grid">
          <div class="field" id="fieldTipo">
            <label for="f-tipo">Actividad realizada</label>
            <select id="f-tipo" required></select>
            <span class="tipo-hint" id="tipoHint"></span>
          </div>
          <div class="field">
            <label for="f-fecha">Fecha</label>
            <input type="date" id="f-fecha" required>
          </div>
          <div class="field">
            <label for="f-resp" id="respLabel">Realizada por</label>
            <input type="text" id="f-resp" placeholder="Nombre del operador" required>
          </div>
          <div class="field full">
            <label for="f-desc" id="descLabel">Observaciones <small style="color:var(--muted);font-weight:500;">(opcional)</small></label>
            <textarea id="f-desc" placeholder="Describe cómo quedó el trabajo o cualquier detalle…"></textarea>
          </div>
          <div class="field full">
            <label>Fotos de evidencia <small style="color:var(--muted);font-weight:500;">(hasta 5 fotos)</small></label>
            <div class="comp-btns">
              <label class="comp-btn">
                <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <span>Tomar foto</span>
                <small>Usa la cámara</small>
                <input type="file" accept="image/*" capture="environment" id="f-camera">
              </label>
              <label class="comp-btn">
                <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                <span>Adjuntar fotos</span>
                <small>Desde la galería</small>
                <input type="file" accept="image/*" multiple id="f-file">
              </label>
            </div>
            <div class="fotos-grid" id="fotosGrid"></div>
            <div class="fotos-count" id="fotosCount" style="display:none;"></div>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Guardar registro</button>
      </form>
    </div>

    <!-- ── LISTADO ── -->
    <div class="card">
      <h2 id="listTitle">Historial <span class="badge" id="listBadge">Aseo</span></h2>
      <div class="list-tools">
        <div class="search">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar por actividad, responsable…">
        </div>
        <select id="filterTipo" class="filter-sel">
          <option value="">Todas las actividades</option>
          <option value="aseo_patio">Aseo de patio</option>
          <option value="canaletas">Aseo de canaletas</option>
          <option value="aseo_estacion">Aseo equipo y lavado de estación</option>
          <option value="trampa_grasa">Trampa de grasa</option>
        </select>
        <div class="date-range">
          <input type="date" id="filterDesde" title="Desde">
          <span>a</span>
          <input type="date" id="filterHasta" title="Hasta">
        </div>
        <button class="btn-pdf" id="pdfBtn" onclick="exportarPDF()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>
          Exportar PDF
        </button>
      </div>
      <div id="listContainer"></div>
    </div>
  </div>

  <!-- ── MODAL EVIDENCIAS ── -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Evidencias</h3>
        <button class="x" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = (window.location.port === '3030') ? 'http://localhost:8001/api' : (window.location.origin + '/api');
    function apiFetch(url, options = {}) {
      const token = localStorage.getItem('authToken');
      return fetch(url, { ...options, headers: { 'Content-Type':'application/json', ...(token ? {'Authorization':`Bearer ${token}`} : {}), ...(options.headers || {}) } });
    }

    const MAX_FOTOS = 5;
    const TIPO_META = {
      aseo_patio:    { label: 'Aseo de patio',                      dias: 'Todos los días' },
      canaletas:     { label: 'Aseo de canaletas',                  dias: 'Lunes · Miércoles · Viernes' },
      aseo_estacion: { label: 'Aseo equipo y lavado de estación',   dias: 'Martes · Jueves · Domingo' },
      trampa_grasa:  { label: 'Limpieza trampa de grasa',           dias: 'Sábado' },
      novedad:       { label: 'Novedad',                            dias: '' },
    };
    // Actividades programadas por día de la semana (getDay(): 0=Dom … 6=Sáb).
    // El aseo de patio es diario; los demás días suman su actividad propia.
    const CRONOGRAMA = [
      ['aseo_patio','aseo_estacion'],   // Dom
      ['aseo_patio','canaletas'],       // Lun
      ['aseo_patio','aseo_estacion'],   // Mar
      ['aseo_patio','canaletas'],       // Mié
      ['aseo_patio','aseo_estacion'],   // Jue
      ['aseo_patio','canaletas'],       // Vie
      ['aseo_patio','trampa_grasa'],    // Sáb
    ];
    const DIAS_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const CLASE_ACT  = { aseo_patio:'patio', canaletas:'canaletas', aseo_estacion:'estacion', trampa_grasa:'grasa' };
    // Fecha de HOY en la zona horaria local (toISOString daría el día UTC)
    function hoyLocal() { return new Date().toLocaleDateString('en-CA'); }

    let currentUser = null;
    let areaActual  = 'aseo';   // 'aseo' | 'novedades'
    let edsData     = [];       // registros de la pestaña actual
    let fotos       = [];       // dataURLs pendientes del form

    // ── INIT ──
    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

      renderCronograma();
      poblarTipos();
      document.getElementById('f-fecha').value = hoyLocal();
      if (currentUser && currentUser.nombre) document.getElementById('f-resp').value = currentUser.nombre;

      await cargarActividades();

      document.getElementById('f-tipo').addEventListener('change', actualizarHintTipo);
      document.getElementById('f-camera').addEventListener('change', onFilesPicked);
      document.getElementById('f-file').addEventListener('change', onFilesPicked);
      document.getElementById('edsForm').addEventListener('submit', onSubmit);
      document.getElementById('searchInput').addEventListener('input', renderList);
      document.getElementById('filterTipo').addEventListener('change', renderList);
      document.getElementById('filterDesde').addEventListener('change', cargarActividades);
      document.getElementById('filterHasta').addEventListener('change', cargarActividades);
    });

    // El shell mantiene el iframe vivo entre navegaciones y avisa al volver
    window.addEventListener('message', e => {
      if (e.data?.type === 'VIEW_SHOWN') { renderCronograma(); cargarActividades(); }
    });

    // ── CRONOGRAMA ──
    function renderCronograma() {
      const hoyIdx = new Date().getDay();
      const grid = document.getElementById('cronoGrid');
      // Orden visual Lun→Dom
      const orden = [1,2,3,4,5,6,0];
      grid.innerHTML = orden.map(d => {
        const acts = CRONOGRAMA[d].map(t =>
          `<div class="act ${CLASE_ACT[t]}">${TIPO_META[t].label}</div>`
        ).join('');
        return `<div class="crono-day ${d === hoyIdx ? 'hoy' : ''}">
          <div class="dia">${DIAS_CORTO[d]}${d === hoyIdx ? ' · Hoy' : ''}</div>
          ${acts}
        </div>`;
      }).join('');

      const labelsHoy = CRONOGRAMA[hoyIdx].map(t => `<b>${TIPO_META[t].label}</b>`);
      const listaHoy  = labelsHoy.length > 1
        ? labelsHoy.slice(0, -1).join(', ') + ' y ' + labelsHoy[labelsHoy.length - 1]
        : labelsHoy[0];
      document.getElementById('cronoHoy').innerHTML = `
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>${labelsHoy.length > 1 ? 'Actividades programadas' : 'Actividad programada'} para hoy: ${listaHoy}</span>`;
    }

    function poblarTipos() {
      const sel = document.getElementById('f-tipo');
      sel.innerHTML = ['aseo_patio','canaletas','aseo_estacion','trampa_grasa'].map(t =>
        `<option value="${t}">${TIPO_META[t].label}</option>`
      ).join('');
      sel.value = CRONOGRAMA[new Date().getDay()][0]; // preseleccionar la de hoy (el aseo de patio es diario)
      actualizarHintTipo();
    }

    function actualizarHintTipo() {
      const t = document.getElementById('f-tipo').value;
      document.getElementById('tipoHint').textContent = TIPO_META[t] ? `Días programados: ${TIPO_META[t].dias}` : '';
    }

    // ── TABS ──
    function setArea(area) {
      if (area === areaActual) return;
      areaActual = area;
      document.getElementById('tab-aseo').classList.toggle('active', area === 'aseo');
      document.getElementById('tab-novedades').classList.toggle('active', area === 'novedades');

      const esNov = area === 'novedades';
      document.getElementById('formBadge').textContent = esNov ? 'Novedad' : 'Aseo';
      document.getElementById('listBadge').textContent = esNov ? 'Novedades' : 'Aseo';
      document.getElementById('formTitle').firstChild.textContent = esNov ? 'Reportar novedad ' : 'Registrar actividad ';
      document.getElementById('fieldTipo').style.display = esNov ? 'none' : '';
      document.getElementById('f-tipo').required = !esNov;
      document.getElementById('filterTipo').style.display = esNov ? 'none' : '';
      document.getElementById('respLabel').textContent = esNov ? 'Reportada por' : 'Realizada por';
      document.getElementById('descLabel').innerHTML = esNov
        ? 'Novedad observada'
        : 'Observaciones <small style="color:var(--muted);font-weight:500;">(opcional)</small>';
      document.getElementById('f-desc').placeholder = esNov
        ? 'Describe la novedad que observaste durante el día…'
        : 'Describe cómo quedó el trabajo o cualquier detalle…';
      document.getElementById('submitBtn').textContent = esNov ? 'Reportar novedad' : 'Guardar registro';
      document.getElementById('searchInput').placeholder = esNov
        ? 'Buscar por descripción, responsable…'
        : 'Buscar por actividad, responsable…';
      cargarActividades();
    }

    // ── FOTOS ──
    function onFilesPicked(ev) {
      const files = Array.from(ev.target.files || []);
      for (const file of files) {
        if (!file.type.startsWith('image/')) { showToast('Solo se aceptan imágenes.', true); continue; }
        if (fotos.length >= MAX_FOTOS) { showToast(`Máximo ${MAX_FOTOS} fotos por registro.`, true); break; }
        fotos.push(null);                     // reserva el cupo (la compresión es async)
        compressImage(file, fotos.length - 1);
      }
      ev.target.value = ''; // permite re-seleccionar el mismo archivo
    }

    function compressImage(file, idx) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1600;
          let { width, height } = img;
          if (width > height && width > MAX) { height = Math.round(height * MAX / width); width = MAX; }
          else if (height > MAX) { width = Math.round(width * MAX / height); height = MAX; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          fotos[idx] = canvas.toDataURL('image/jpeg', 0.7);
          renderFotos();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderFotos() {
      const grid  = document.getElementById('fotosGrid');
      const count = document.getElementById('fotosCount');
      const listas = fotos.filter(Boolean);
      grid.classList.toggle('show', listas.length > 0);
      count.style.display = listas.length > 0 ? '' : 'none';
      count.textContent = `${listas.length} de ${MAX_FOTOS} fotos`;
      grid.innerHTML = listas.map((f, i) => `
        <div class="foto-thumb">
          <img src="${f}" alt="Evidencia ${i+1}">
          <button type="button" class="rm" onclick="quitarFoto(${i})" title="Quitar">&times;</button>
        </div>`).join('');
    }

    function quitarFoto(i) {
      fotos = fotos.filter(Boolean);
      fotos.splice(i, 1);
      renderFotos();
    }

    // ── GUARDAR ──
    async function onSubmit(ev) {
      ev.preventDefault();
      const btn   = document.getElementById('submitBtn');
      const esNov = areaActual === 'novedades';
      const tipo  = esNov ? 'novedad' : document.getElementById('f-tipo').value;
      const fecha = document.getElementById('f-fecha').value;
      const resp  = document.getElementById('f-resp').value.trim();
      const desc  = document.getElementById('f-desc').value.trim();
      if (!tipo || !fecha || !resp) { showToast('Completa los campos obligatorios', true); return; }
      if (esNov && !desc) { showToast('Describe la novedad observada', true); return; }
      if (fotos.some(f => !f)) { showToast('Espera a que terminen de cargar las fotos…', true); return; }

      const payload = {
        tipo, fecha,
        realizado_por: resp,
        descripcion: desc,
        fotos: fotos.filter(Boolean),
      };

      btn.disabled = true; btn.textContent = 'Guardando…';
      try {
        const res = await apiFetch(`${API}/eds`, { method:'POST', body: JSON.stringify(payload) });
        if (!res.ok) {
          const err = await res.json().catch(()=>({}));
          throw new Error(err.error || 'Error al guardar');
        }
        btn.classList.add('ok'); btn.textContent = esNov ? '✓ Reportada' : '✓ Registrada';
        showToast(esNov ? 'Novedad reportada correctamente' : 'Actividad registrada correctamente');
        resetForm();
        await cargarActividades();
        setTimeout(() => {
          btn.classList.remove('ok');
          btn.textContent = areaActual === 'novedades' ? 'Reportar novedad' : 'Guardar registro';
          btn.disabled = false;
        }, 1700);
      } catch (e) {
        showToast(e.message || 'Error al guardar', true);
        btn.disabled = false;
        btn.textContent = esNov ? 'Reportar novedad' : 'Guardar registro';
      }
    }

    function resetForm() {
      document.getElementById('f-desc').value = '';
      document.getElementById('f-fecha').value = hoyLocal();
      fotos = [];
      renderFotos();
    }

    // ── LISTAR ──
    async function cargarActividades() {
      const params = new URLSearchParams({ tipo: areaActual === 'novedades' ? 'novedad' : 'aseo' });
      const desde = document.getElementById('filterDesde').value;
      const hasta = document.getElementById('filterHasta').value;
      if (desde) params.set('desde', desde);
      if (hasta) params.set('hasta', hasta);
      try {
        const res = await apiFetch(`${API}/eds?${params}`);
        edsData = await res.json();
        if (!Array.isArray(edsData)) edsData = [];
      } catch (e) {
        edsData = [];
      }
      renderList();
    }

    function fmtFecha(f) {
      if (!f) return '—';
      const d = new Date(String(f).length > 10 ? f : f + 'T00:00:00');
      if (isNaN(d)) return f;
      return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
    }

    function filasFiltradas() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const tipoFilter = document.getElementById('filterTipo').value;
      let rows = edsData;
      if (areaActual === 'aseo' && tipoFilter) rows = rows.filter(a => a.tipo === tipoFilter);
      if (q) rows = rows.filter(a => {
        const hay = [a.fecha, TIPO_META[a.tipo]?.label, a.realizado_por, a.descripcion]
          .filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
      return rows;
    }

    function renderList() {
      const cont  = document.getElementById('listContainer');
      const rows  = filasFiltradas();
      const esNov = areaActual === 'novedades';

      if (rows.length === 0) {
        cont.innerHTML = `<div class="empty">
          <svg width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <div>${edsData.length === 0
            ? (esNov ? 'Aún no hay novedades reportadas.' : 'Aún no hay actividades de aseo registradas.')
            : 'No hay resultados para tu búsqueda.'}</div>
        </div>`;
        return;
      }

      const body = rows.map(a => `
        <tr>
          <td data-label="Fecha">${fmtFecha(a.fecha)}</td>
          <td data-label="${esNov ? 'Tipo' : 'Actividad'}"><span class="tipo-pill ${a.tipo}">${TIPO_META[a.tipo]?.label || a.tipo}</span></td>
          <td data-label="${esNov ? 'Descripción' : 'Observaciones'}"><span class="desc-cell" title="${(a.descripcion||'').replace(/"/g,'&quot;')}">${a.descripcion || '—'}</span></td>
          <td data-label="${esNov ? 'Reportada por' : 'Realizada por'}">${a.realizado_por || '—'}</td>
          <td data-label="Evidencias">${a.num_fotos > 0
            ? `<button class="btn-sm ver" onclick="verEvidencias(${a.id})">Ver (${a.num_fotos})</button>`
            : '<span class="no-comp">Sin fotos</span>'}</td>
          <td class="acciones"><button class="btn-sm del" onclick="eliminarActividad(${a.id})">Eliminar</button></td>
        </tr>`).join('');

      cont.innerHTML = `<table>
        <thead><tr>
          <th>Fecha</th><th>${esNov ? 'Tipo' : 'Actividad'}</th><th>${esNov ? 'Descripción' : 'Observaciones'}</th><th>${esNov ? 'Reportada por' : 'Realizada por'}</th><th>Evidencias</th><th></th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>`;
    }

    // ── VER EVIDENCIAS ──
    async function verEvidencias(id) {
      const a = edsData.find(x => x.id === id);
      try {
        const res = await apiFetch(`${API}/eds/${id}/fotos`);
        if (!res.ok) throw new Error('No se pudo cargar');
        const data = await res.json();
        const body = document.getElementById('modalBody');
        const info = a ? `<div class="m-info">
            <div><b>Fecha:</b> ${fmtFecha(a.fecha)}</div>
            <div><b>Actividad:</b> ${TIPO_META[a.tipo]?.label || a.tipo}</div>
            <div><b>${a.tipo === 'novedad' ? 'Reportada por' : 'Realizada por'}:</b> ${a.realizado_por || '—'}</div>
            ${a.descripcion ? `<div><b>${a.tipo === 'novedad' ? 'Novedad' : 'Observaciones'}:</b> ${a.descripcion}</div>` : ''}
          </div>` : '';
        const imgs = (data.fotos || []).map((f,i) => `<img src="${f}" alt="Evidencia ${i+1}" style="max-width:100%;">`).join('');
        body.innerHTML = info + (imgs || '<span class="no-comp">Sin fotos</span>');
        document.getElementById('modalTitle').textContent = a ? `Evidencias — ${TIPO_META[a.tipo]?.label || a.tipo}` : 'Evidencias';
        document.getElementById('modalBg').classList.add('show');
      } catch (e) {
        showToast('No se pudieron abrir las evidencias', true);
      }
    }
    function closeModal() {
      document.getElementById('modalBg').classList.remove('show');
      document.getElementById('modalBody').innerHTML = '';
    }
    document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

    // ── ELIMINAR ──
    async function eliminarActividad(id) {
      if (!confirm('¿Eliminar este registro y sus fotos? Esta acción no se puede deshacer.')) return;
      try {
        const res = await apiFetch(`${API}/eds/${id}`, { method:'DELETE' });
        if (!res.ok) throw new Error('Error');
        showToast('Registro eliminado');
        await cargarActividades();
      } catch (e) {
        showToast('No se pudo eliminar', true);
      }
    }

    // ── EXPORTAR PDF ──
    function cargarImg(dataUrl) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload  = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = dataUrl;
      });
    }

    /* Librerías pesadas (jsPDF) bajo demanda: no bloquean la carga de la vista */
    const _libsCargadas = {};
    function cargarLibreria(src) {
      if (!_libsCargadas[src]) {
        _libsCargadas[src] = new Promise((ok, fail) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload  = ok;
          s.onerror = () => { delete _libsCargadas[src]; fail(new Error('No se pudo descargar la librería. Revisa tu conexión.')); };
          document.head.appendChild(s);
        });
      }
      return _libsCargadas[src];
    }
    const LIB_JSPDF     = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    const LIB_AUTOTABLE = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';

    async function exportarPDF() {
      const rows = filasFiltradas();
      if (rows.length === 0) { showToast('No hay registros para exportar', true); return; }

      const btn = document.getElementById('pdfBtn');
      btn.disabled = true;
      const btnHtml = btn.innerHTML;
      btn.textContent = 'Generando…';

      try {
        await cargarLibreria(LIB_JSPDF);
        await cargarLibreria(LIB_AUTOTABLE);  // plugin: requiere jsPDF ya cargado
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const pageW = doc.internal.pageSize.getWidth();   // ~210
        const pageH = doc.internal.pageSize.getHeight();  // ~297
        const margin = 14;
        const maxY = pageH - 16;
        let y = 18;

        const esNov = areaActual === 'novedades';
        const desde = document.getElementById('filterDesde').value;
        const hasta = document.getElementById('filterHasta').value;
        const rango = (desde || hasta) ? `${desde ? fmtFecha(desde) : '…'} a ${hasta ? fmtFecha(hasta) : 'hoy'}` : 'Todo el historial';

        doc.setFontSize(15); doc.setFont(undefined, 'bold');
        doc.text(`Informe Operador EDS — ${esNov ? 'Novedades' : 'Actividades de aseo'} — La Milagrosa`, margin, y); y += 7;
        doc.setFontSize(10); doc.setFont(undefined, 'normal'); doc.setTextColor(100);
        doc.text(`Periodo: ${rango}   ·   Registros: ${rows.length}`, margin, y); y += 5;
        doc.text(`Generado: ${new Date().toLocaleString('es-CO')}`, margin, y); y += 8;
        doc.setTextColor(0);

        for (const a of rows) {
          if (y + 30 > maxY) { doc.addPage(); y = 18; }

          doc.autoTable({
            startY: y,
            margin: { left: margin, right: margin },
            head: [['Fecha', esNov ? 'Tipo' : 'Actividad', esNov ? 'Reportada por' : 'Realizada por']],
            body: [[
              fmtFecha(a.fecha),
              TIPO_META[a.tipo]?.label || a.tipo,
              a.realizado_por || '—',
            ]],
            styles: { fontSize: 9, cellPadding: 2.5 },
            headStyles: { fillColor: esNov ? [239, 68, 68] : [34, 197, 94] },
            theme: 'grid',
          });
          y = doc.lastAutoTable.finalY + 4;

          if (a.descripcion) {
            const lines = doc.splitTextToSize(`${esNov ? 'Novedad' : 'Observaciones'}: ${a.descripcion}`, pageW - margin * 2);
            if (y + lines.length * 4.5 > maxY) { doc.addPage(); y = 18; }
            doc.setFontSize(9); doc.setTextColor(60);
            doc.text(lines, margin, y);
            y += lines.length * 4.5 + 3;
            doc.setTextColor(0);
          }

          if (a.num_fotos > 0) {
            let fotosAct = [];
            try {
              const res = await apiFetch(`${API}/eds/${a.id}/fotos`);
              if (res.ok) {
                const d = await res.json();
                fotosAct = d.fotos || [];
              }
            } catch (e) { /* sin fotos si falla */ }

            const fotoW = (pageW - margin * 2 - 6) / 2;  // 2 por fila
            let col = 0, rowH = 0;
            for (const f of fotosAct) {
              const img = await cargarImg(f);
              if (!img) continue;
              let w = fotoW;
              let h = w * img.height / img.width;
              if (h > 70) { h = 70; w = h * img.width / img.height; }
              if (col === 0 && y + h > maxY) { doc.addPage(); y = 18; rowH = 0; }
              if (col === 1 && y + h > maxY) { doc.addPage(); y = 18; col = 0; rowH = 0; }
              const x = margin + col * (fotoW + 6);
              try { doc.addImage(f, 'JPEG', x, y, w, h); } catch (e) { continue; }
              rowH = Math.max(rowH, h);
              col++;
              if (col === 2) { y += rowH + 5; col = 0; rowH = 0; }
            }
            if (col > 0) y += rowH + 5;
          }
          y += 5;
        }

        const hoy = new Date().toISOString().slice(0,10);
        doc.save(`operador_eds_${esNov ? 'novedades' : 'aseo'}_${hoy}.pdf`);
        showToast('PDF generado');
      } catch (e) {
        showToast('No se pudo generar el PDF', true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = btnHtml;
      }
    }

    // ── TOAST ──
    let toastT;
    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('err', !!isErr);
      t.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(() => t.classList.remove('show'), 2600);
    }
  </script>
</body>
