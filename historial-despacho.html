<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Favicon BusControl (logo bus) -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Milagrosa — Historial de Despacho</title>
  <script>
    (function(){
      document.addEventListener('contextmenu',function(e){e.preventDefault();});
      document.addEventListener('keydown',function(e){
        if(e.key==='F12'){e.preventDefault();return false;}
        if(e.ctrlKey&&e.shiftKey&&['I','J','C','U'].includes(e.key.toUpperCase())){e.preventDefault();return false;}
        if(e.ctrlKey&&e.key.toUpperCase()==='U'){e.preventDefault();return false;}
      });
    })();
  </script>
  <script>
    (function() {
      if (window.location === window.parent.location) {
        const token = localStorage.getItem('authToken');
        if (!token) { window.location.href = '/index.html'; }
      }
    })();
  </script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    img, svg, video { max-width: 100%; }

    :root {
      --bg:      #f4f4f6;
      --surface: #ffffff;
      --card:    #fafafb;
      --border:  #e5e5eb;
      --border2: #d0d0d8;
      --accent:  #6366f1;
      --green:   #22c55e;
      --yellow:  #f59e0b;
      --red:     #ef4444;
      --txt:     #111;
      --txt2:    #555;
      --txt3:    #888;
      --radius:  10px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--txt);
      overflow: hidden;
    }

    .page { display: flex; flex-direction: column; height: 100vh; }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .topbar-title svg { color: var(--green); }

    .topbar-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }

    .lbl { font-size: 11px; color: var(--txt2); font-weight: 600; letter-spacing: .4px; text-transform: uppercase; white-space: nowrap; }

    .date-wrap { display: flex; align-items: center; gap: 8px; }

    .date-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--txt);
      font-size: 13px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
      color-scheme: light;
    }
    .date-input:focus { border-color: var(--accent); }

    .btn-buscar {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 16px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-buscar:hover { background: #4f52d1; }

    .btn-hoy {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--txt2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .13s;
      white-space: nowrap;
    }
    .btn-hoy:hover { border-color: var(--green); color: var(--green); }

    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .count-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--txt2);
      white-space: nowrap;
    }
    .count-pill strong { color: var(--txt); }

    /* ── TABLE AREA ── */
    .table-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 24px;
    }

    /* ── DATE GROUP ── */
    .date-group { margin-bottom: 20px; }

    .date-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .date-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--txt2);
      letter-spacing: .2px;
      white-space: nowrap;
    }
    .date-label span.hoy-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 10px;
      background: rgba(34,197,94,.15);
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .date-line { flex: 1; height: 1px; background: var(--border); }

    .date-count {
      font-size: 11px;
      color: var(--txt3);
      white-space: nowrap;
    }

    /* ── TABLE ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table { width: 100%; min-width: 600px; border-collapse: collapse; }

    thead th {
      background: var(--card);
      padding: 9px 14px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--txt3);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafb; }

    tbody td { padding: 9px 14px; font-size: 13px; vertical-align: middle; }

    .bus-num {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--txt);
    }
    .bus-placa {
      font-size: 11px;
      color: var(--txt2);
      margin-top: 1px;
      font-family: monospace;
      letter-spacing: .5px;
    }

    .badge-grupo {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-a { background: rgba(99,102,241,.12); color: #4338ca; }
    .badge-b { background: rgba(236,72,153,.12); color: #be185d; }

    .conductor-nombre { font-weight: 500; }
    /* Bus con relevo: los conductores siguientes con la lectura con que reciben el bus */
    .tag-relevo {
      display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px;
      background: #ede9fe; color: #6d28d9; font-size: 10px; font-weight: 800; vertical-align: 1px;
    }
    .rel-lista { margin-top: 3px; font-size: 12px; color: #5b21b6; line-height: 1.5; }
    .rel-lista small { color: var(--txt3); }
    .acciones-adm { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

    /* Ventana de relevo (igual que en Despacho) */
    .modal.ancho { max-width: 580px; }
    .rel-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .rel-card.sale { background: #fafafb; }
    .rel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .rel-titulo { font-size: 13px; font-weight: 800; }
    .rel-titulo small { font-weight: 600; color: var(--txt3); margin-left: 4px; }
    .rel-quitar { background: none; border: none; color: var(--red); font: 600 12px inherit; cursor: pointer; padding: 2px 4px; }
    .rel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rel-grid label { display: block; font-size: 11px; font-weight: 700; color: var(--txt2); margin-bottom: 4px; }
    .rel-grid label b { color: var(--red); }
    .rel-grid select, .rel-grid input {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border2); border-radius: 10px;
      font: 14px inherit; background: #fff; color: var(--txt); box-sizing: border-box;
    }
    .rel-grid input:focus, .rel-grid select:focus { outline: none; border-color: var(--accent); }
    .rel-dato { font-size: 13px; color: var(--txt2); line-height: 1.6; }
    .rel-dato b { color: var(--txt); }
    .rel-nota { font-size: 11.5px; color: var(--txt3); margin-top: 7px; }
    .rel-nota.err { color: var(--red); }
    .rel-agregar {
      width: 100%; padding: 10px; border: 1px dashed var(--accent); border-radius: 10px;
      background: none; color: var(--accent); font: 700 13px inherit; cursor: pointer; margin-bottom: 10px;
    }
    .rel-agregar:hover { background: rgba(99,102,241,.07); }
    .rel-resumen { background: #f5f3ff; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.7; }
    .rel-liquidado { background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; border-radius:10px;
      padding:10px 12px; font-size:12.5px; line-height:1.5; margin-bottom:12px; }
    .rel-resumen .fila { display: flex; justify-content: space-between; gap: 10px; }
    .rel-resumen .fila span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* Corregir REG: lecturas del relevo entre la inicial y la final */
    .reg-relevos { margin-top: 12px; display: grid; gap: 10px; }
    .conductor-vacio  { color: var(--txt3); font-style: italic; font-size: 12px; }

    .ruta-nombre { font-size: 12px; color: var(--txt2); }
    .ruta-vacia  { color: var(--txt3); font-style: italic; font-size: 12px; }

    .estado-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .estado-badge::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge-trabajando { background: rgba(34,197,94,.12);  color: var(--green); }
    .badge-taller     { background: rgba(245,158,11,.12); color: var(--yellow); }
    .badge-descanso   { background: rgba(85,85,85,.15);   color: var(--txt3); }

    .viajes-cell {
      text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--txt); font-size: 13px;
    }

    /* ── CORRECCIÓN DE REGISTRADORA (solo Administrador) ── */
    .btn-corregir {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 8px; white-space: nowrap;
      border: 1px solid var(--border2); background: #fff; color: var(--txt2);
      font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
      transition: all .13s;
    }
    .btn-corregir:hover { border-color: var(--accent); color: var(--accent); }
    .pax-invalida {
      display: inline-block; padding: 2px 7px; border-radius: 6px;
      background: rgba(239,68,68,.12); color: #b91c1c; font-size: 10px; font-weight: 800;
    }
    tr.recien-corregido td { animation: flashOk 1.8s ease-out; }
    @keyframes flashOk { 0% { background: rgba(34,197,94,.22); } 100% { background: transparent; } }

    .modal-bg {
      position: fixed; inset: 0; z-index: 1000; background: rgba(15,15,20,.5);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg[hidden] { display: none; }
    .modal {
      background: var(--surface); border-radius: 16px; width: 100%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden;
      max-height: calc(100vh - 32px); display: flex; flex-direction: column;
    }
    .modal-head { padding: 18px 20px 6px; }
    .modal-title { font-size: 16px; font-weight: 800; }
    .modal-sub   { font-size: 12px; color: var(--txt3); margin-top: 3px; }
    .modal-body  { padding: 12px 20px 4px; overflow-y: auto; }
    .reg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .campo label {
      display: block; font-size: 11px; font-weight: 700; color: var(--txt2);
      text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px;
    }
    .campo input, .campo textarea {
      width: 100%; border: 1.5px solid var(--border2); border-radius: 10px;
      padding: 9px 11px; font-family: inherit; font-size: 16px; color: var(--txt);
      outline: none; background: #fff;
    }
    .campo input { font-weight: 700; font-variant-numeric: tabular-nums; }
    .campo textarea { resize: vertical; min-height: 54px; font-size: 16px; }
    .campo input:focus, .campo textarea:focus { border-color: var(--accent); }
    .campo .antes { font-size: 11px; color: var(--txt3); margin-top: 4px; }
    .campo .pista { font-size: 11px; color: var(--txt2); margin-top: 3px; }
    .campo .pista button {
      border: none; background: none; color: var(--accent); font: inherit;
      font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline;
    }
    .pax-preview {
      margin-top: 14px; padding: 11px 13px; border-radius: 10px; background: var(--card);
      border: 1px solid var(--border); display: flex; justify-content: space-between;
      align-items: baseline; gap: 10px; font-size: 12px; color: var(--txt2);
    }
    .pax-preview strong { font-size: 18px; color: var(--txt); font-variant-numeric: tabular-nums; }
    .pax-preview.mal { background: rgba(239,68,68,.07); border-color: rgba(239,68,68,.3); }
    .pax-preview.mal strong { color: #b91c1c; font-size: 13px; }
    .modal-nota { font-size: 11.5px; color: var(--txt3); margin-top: 12px; line-height: 1.4; }
    .modal-err {
      margin-top: 12px; padding: 9px 12px; border-radius: 9px; font-size: 12.5px;
      background: rgba(239,68,68,.1); color: #b91c1c; font-weight: 600;
    }
    .modal-err[hidden] { display: none; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px 18px; }
    .btn-sec {
      padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border2);
      background: #fff; color: var(--txt2); font-family: inherit; font-size: 13px;
      font-weight: 700; cursor: pointer;
    }
    .btn-pri {
      padding: 9px 18px; border-radius: 10px; border: none; background: var(--accent);
      color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-pri:disabled { opacity: .55; cursor: default; }

    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: #111; color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; z-index: 1100; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .toast[hidden] { display: none; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--txt3);
    }
    .empty-state svg { opacity: .3; margin-bottom: 12px; }
    .empty-state p   { font-size: 14px; }

    /* ── LOADING ── */
    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 12px;
      color: var(--txt2);
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE MÓVIL ── */
    @media (max-width: 720px) {
      .rel-grid { grid-template-columns: 1fr; }
      .rel-grid select, .rel-grid input { font-size: 16px; }
      .acciones-adm { justify-content: flex-start; }
      .topbar { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 8px; }
      .topbar-sep { display: none; }
      .date-wrap { flex-wrap: wrap; }
      .topbar-right { margin-left: 0; width: 100%; }
      .table-area { padding: 10px 12px 20px; }

      /* Tarjetas en lugar de tabla */
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }

      tbody tr {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 8px;
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: center;
      }
      tbody tr:hover { background: var(--card); }

      tbody td {
        padding: 0;
        font-size: 12px;
        border: none;
      }
      tbody td::before {
        content: attr(data-label);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .5px;
        color: var(--txt3);
        display: block;
        margin-bottom: 2px;
      }
      .table-wrap { background: transparent; border: none; border-radius: 0; overflow: visible; }
      table { min-width: unset; }
      tbody td.col-corregir { width: 100%; }
      tbody td.col-corregir::before { display: none; }
      .btn-corregir { width: 100%; justify-content: center; padding: 8px; font-size: 12px; }
      .modal-bg { align-items: flex-end; padding: 0; }
      .modal { max-width: none; border-radius: 16px 16px 0 0; max-height: 92vh; }
      .modal-foot { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
      .modal-foot button { flex: 1; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-title">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8"  y1="2" x2="8"  y2="6"/>
        <line x1="3"  y1="10" x2="21" y2="10"/>
        <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
      </svg>
      Historial de Despacho
    </div>

    <div class="topbar-sep"></div>

    <div class="date-wrap">
      <span class="lbl">Desde</span>
      <input type="date" id="inputDesde" class="date-input" />
    </div>

    <div class="date-wrap">
      <span class="lbl">Hasta</span>
      <input type="date" id="inputHasta" class="date-input" />
    </div>

    <button class="btn-buscar" onclick="cargar()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Buscar
    </button>

    <button class="btn-hoy" onclick="irHoy()">Hoy</button>

    <div class="topbar-right">
      <div class="count-pill" id="totalPill">— registros</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="table-area" id="tableArea">
    <div class="loading-state">
      <div class="spinner"></div>
      <span>Cargando historial…</span>
    </div>
  </div>

</div>

<!-- Corregir registradora (solo Administrador) -->
<div class="modal-bg" id="regModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="regTitulo">
    <div class="modal-head">
      <div class="modal-title" id="regTitulo">Corregir registradora</div>
      <div class="modal-sub" id="regSub">—</div>
    </div>
    <div class="modal-body">
      <div class="reg-grid">
        <div class="campo">
          <label for="regIni">Inicial</label>
          <input id="regIni" type="text" inputmode="numeric" autocomplete="off" />
          <div class="antes" id="regIniAntes"></div>
          <div class="pista" id="regIniPista"></div>
        </div>
        <div class="campo">
          <label for="regFin">Final</label>
          <input id="regFin" type="text" inputmode="numeric" autocomplete="off" />
          <div class="antes" id="regFinAntes"></div>
          <div class="pista" id="regFinPista"></div>
        </div>
      </div>
      <div class="reg-relevos" id="regRelevos"></div>
      <div class="pax-preview" id="regPax"><span>Pasajeros</span><strong>—</strong></div>
      <div class="campo" style="margin-top:14px">
        <label for="regMotivo">Motivo (opcional)</label>
        <textarea id="regMotivo" maxlength="300" placeholder="Ej: el despachador digitó mal la final"></textarea>
      </div>
      <div class="modal-nota">
        Se actualizan los pasajeros de Movilidad de ese día y el cambio queda en Auditoría.
      </div>
      <div class="modal-err" id="regErr" hidden></div>
    </div>
    <div class="modal-foot">
      <button class="btn-sec" type="button" onclick="cerrarCorreccion()">Cancelar</button>
      <button class="btn-pri" type="button" id="regGuardar" onclick="guardarCorreccion()">Guardar corrección</button>
    </div>
  </div>
</div>
<!-- Agregar o editar relevo de un día pasado (solo Administrador) -->
<div class="modal-bg" id="relModal" hidden>
  <div class="modal ancho" role="dialog" aria-modal="true" aria-labelledby="relTitulo">
    <div class="modal-head">
      <div class="modal-title" id="relTitulo">Relevo de conductor</div>
      <div class="modal-sub" id="relSub">—</div>
    </div>
    <div class="modal-body" id="relBody"></div>
    <div class="modal-body" style="padding-top:0">
      <div class="modal-nota">El cambio queda en Auditoría. Recaudo toma estos conductores y tramos al liquidar.</div>
      <div class="modal-err" id="relErr" hidden></div>
    </div>
    <div class="modal-foot">
      <button class="btn-sec" type="button" onclick="cerrarRelevo()">Cancelar</button>
      <button class="btn-pri" type="button" id="relGuardar" onclick="guardarRelevo()">Guardar relevo</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
  const API = (window.location.port === '3030') ? 'http://localhost:8001' : '';

  function token() { return localStorage.getItem('authToken') || ''; }
  function esc(t) {
    return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function apiFetch(path, opts = {}) {
    const r = await fetch(API + path, {
      ...opts,
      headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' }
    });
    if (r.status === 401) { window.location.href = '/index.html'; return null; }
    if (!r.ok) {
      let msg = '';
      try { msg = (await r.json()).error; } catch (_) { /* respuesta sin JSON */ }
      throw new Error(msg || 'No se pudo completar la operación');
    }
    return r.json();
  }

  // Solo el Administrador corrige la registradora (el servidor también lo exige)
  const esAdmin = (() => {
    try { return JSON.parse(localStorage.getItem('currentUser') || '{}').rol === 'Administrador'; }
    catch (_) { return false; }
  })();
  let filasCargadas = [];

  // ── Fechas por defecto: mes en curso hasta hoy ──
  // Se usa el primer día del mes (no "hace 30 días") para que el date-picker
  // nativo abra el calendario en el mes actual y el despachador no tenga que
  // desplazarse hacia atrás cada vez que elige otra fecha de inicio.
  function hoy() {
    return new Date().toISOString().slice(0, 10);
  }
  function primerDelMes() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
  }

  const inputDesde = document.getElementById('inputDesde');
  const inputHasta = document.getElementById('inputHasta');
  inputDesde.value  = primerDelMes();
  inputHasta.value  = hoy();
  inputDesde.max    = hoy();
  inputHasta.max    = hoy();

  // Sincronizar límites al cambiar
  inputDesde.addEventListener('change', () => {
    if (inputHasta.value < inputDesde.value) inputHasta.value = inputDesde.value;
  });
  inputHasta.addEventListener('change', () => {
    if (inputDesde.value > inputHasta.value) inputDesde.value = inputHasta.value;
  });

  function irHoy() {
    inputDesde.value = hoy();
    inputHasta.value = hoy();
    cargar();
  }

  // En producción (Postgres) la API entrega las fechas como "Fri, 17 Oct 2026 00:00:00 GMT";
  // en SQLite llegan como "2026-10-17". Todo el historial trabaja con AAAA-MM-DD.
  function aISO(f) {
    if (/^\d{4}-\d{2}-\d{2}/.test(f)) return f.slice(0, 10);
    const d = new Date(f);
    return isNaN(d) ? f : d.toISOString().slice(0, 10);
  }

  // ── Formatear fecha para encabezado ──
  function formatFecha(iso) {
    const [y, m, d] = iso.split('-');
    const date = new Date(+y, +m - 1, +d);
    const dias  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                   'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return `${dias[date.getDay()]} ${+d} de ${meses[+m - 1]} de ${y}`;
  }

  // ── Badge de estado ──
  function estadoBadge(estado) {
    if (!estado) return `<span class="estado-badge badge-descanso">Sin datos</span>`;
    const map = {
      trabajando: ['badge-trabajando', 'Trabajando'],
      taller:     ['badge-taller',     'En taller'],
      descanso:   ['badge-descanso',   'Descanso'],
    };
    const [cls, lbl] = map[estado] || ['badge-descanso', estado];
    return `<span class="estado-badge ${cls}">${lbl}</span>`;
  }

  // ── Renderizar ──
  function render(rows) {
    const area  = document.getElementById('tableArea');
    const pill  = document.getElementById('totalPill');
    const todayStr = hoy();

    if (!rows || rows.length === 0) {
      pill.innerHTML = '<strong>0</strong> registros';
      area.innerHTML = `
        <div class="empty-state">
          <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <p>No hay registros de despacho en este período.</p>
        </div>`;
      return;
    }

    pill.innerHTML = `<strong>${rows.length}</strong> registros`;

    // Agrupar por fecha
    const grupos = {};
    for (const r of rows) {
      if (!grupos[r.fecha]) grupos[r.fecha] = [];
      grupos[r.fecha].push(r);
    }

    const fechasOrdenadas = Object.keys(grupos).sort((a, b) => b.localeCompare(a));

    let html = '';
    for (const fecha of fechasOrdenadas) {
      const buses  = grupos[fecha];
      const esHoy  = fecha === todayStr;
      const label  = formatFecha(fecha);

      html += `
        <div class="date-group">
          <div class="date-header">
            <span class="date-label">
              ${label}${esHoy ? '<span class="hoy-tag">HOY</span>' : ''}
            </span>
            <div class="date-line"></div>
            <span class="date-count">${buses.length} ${buses.length === 1 ? 'unidad' : 'unidades'}</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Unidad</th>
                  <th>Tipo</th>
                  <th>Conductor</th>
                  <th>Ruta</th>
                  <th style="text-align:right">REG Ini</th>
                  <th style="text-align:right">REG Fin</th>
                  <th style="text-align:right">Pax</th>
                  <th>Estado</th>
                  <th style="text-align:right">Viajes</th>
                  ${esAdmin ? '<th></th>' : ''}
                </tr>
              </thead>
              <tbody>`;

      for (const b of buses) {
        const grupoCls = b.grupo === 'A' ? 'badge-a' : 'badge-b';
        const grupoLbl = b.grupo === 'A' ? 'Bus' : 'Micro';
        const viajes   = (b.viajes_realizados == null) ? '—' : b.viajes_realizados;
        const regIni   = (b.registradora_inicio == null) ? '—' : b.registradora_inicio.toLocaleString('es-CO');
        const regFin   = (b.registradora_fin    == null) ? '—' : b.registradora_fin.toLocaleString('es-CO');
        const ambas    = b.registradora_inicio != null && b.registradora_fin != null;
        const pax      = !ambas ? '—'
          : b.registradora_fin >= b.registradora_inicio
            ? (b.registradora_fin - b.registradora_inicio).toLocaleString('es-CO')
            : '<span class="pax-invalida" title="La registradora final es menor que la inicial">Inválida</span>';
        const relevos  = b.relevos || [];
        const corregir = esAdmin && b.estado === 'trabajando'
          ? `<div class="acciones-adm">
             <button class="btn-corregir" onclick="abrirCorreccion('${fecha}', ${b.bus_id})">
               <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
               Corregir REG</button>
             ${b.conductor_id ? `<button class="btn-corregir" onclick="abrirRelevo('${fecha}', ${b.bus_id})">
               ${relevos.length ? 'Editar relevo' : '+ Relevo'}</button>` : ''}
             </div>` : '';
        const listaRelevo = relevos.length ? `<div class="rel-lista">${relevos.map(r =>
            `→ ${r.orden}. ${esc(r.conductor_nombre || 'Conductor ' + r.orden)} <small>desde ${fmtN(r.registradora)}</small>`).join('<br>')}</div>` : '';
        html += `
                <tr id="fila-${fecha}-${b.bus_id}">
                  <td data-label="Unidad">
                    <div class="bus-num">${b.numero}</div>
                    <div class="bus-placa">${b.placa || '—'}</div>
                  </td>
                  <td data-label="Tipo">
                    <span class="badge-grupo ${grupoCls}">${grupoLbl}</span>
                  </td>
                  <td data-label="Conductor">
                    ${b.conductor_nombre
                      ? `<span class="conductor-nombre">${relevos.length ? '1. ' : ''}${b.conductor_nombre}</span>${relevos.length ? `<span class="tag-relevo">${relevos.length + 1} conductores</span>` : ''}${listaRelevo}`
                      : `<span class="conductor-vacio">Sin asignar</span>`}
                  </td>
                  <td data-label="Ruta">
                    ${b.ruta_nombre
                      ? `<span class="ruta-nombre">${b.ruta_nombre}</span>`
                      : `<span class="ruta-vacia">Sin ruta</span>`}
                  </td>
                  <td data-label="REG Ini" class="viajes-cell">${regIni}</td>
                  <td data-label="REG Fin" class="viajes-cell">${regFin}</td>
                  <td data-label="Pax"     class="viajes-cell">${pax}</td>
                  <td data-label="Estado">${estadoBadge(b.estado)}</td>
                  <td data-label="Viajes" class="viajes-cell">${viajes}</td>
                  ${esAdmin ? `<td class="col-corregir">${corregir}</td>` : ''}
                </tr>`;
      }

      html += `
              </tbody>
            </table>
          </div>
        </div>`;
    }

    area.innerHTML = html;
  }

  // ── Cargar datos ──
  // El shell mantiene el iframe vivo entre navegaciones y avisa al volver
  window.addEventListener('message', e => {
    if (e.data?.type === 'VIEW_SHOWN') cargar();
  });

  async function cargar() {
    const area  = document.getElementById('tableArea');
    const desde = inputDesde.value;
    const hasta = inputHasta.value;

    area.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Cargando historial…</span>
      </div>`;

    try {
      const rows = await apiFetch(`/api/despacho/historial?desde=${desde}&hasta=${hasta}`);
      if (rows !== null) {
        filasCargadas = rows.map(r => ({ ...r, fecha: aISO(r.fecha) }));
        render(filasCargadas);
      }
    } catch (e) {
      area.innerHTML = `
        <div class="empty-state">
          <p>Error al cargar el historial. Intente nuevamente.</p>
        </div>`;
    }
  }

  // ── Corrección de registradora (solo Administrador) ──
  let corrigiendo = null;
  const fmtN   = n => (n == null) ? '—' : Number(n).toLocaleString('es-CO');
  const leerN  = id => {
    const v = document.getElementById(id).value.replace(/\D/g, '');
    return v === '' ? null : parseInt(v, 10);
  };

  /* Lectura del mismo bus en el día cargado más cercano antes / después:
     el torniquete lleva consecutivo, así que sirven de referencia */
  function vecino(busId, fecha, dir) {
    const cands = filasCargadas.filter(r => r.bus_id === busId &&
      (dir < 0 ? r.fecha < fecha && r.registradora_fin != null
               : r.fecha > fecha && r.registradora_inicio != null));
    cands.sort((a, b) => dir < 0 ? b.fecha.localeCompare(a.fecha) : a.fecha.localeCompare(b.fecha));
    return cands[0] || null;
  }

  function abrirCorreccion(fecha, busId) {
    const b = filasCargadas.find(r => r.fecha === fecha && r.bus_id === busId);
    if (!b) return;
    corrigiendo = b;
    document.getElementById('regSub').textContent =
      `Bus ${b.numero} · ${b.placa || 's/placa'} · ${formatFecha(fecha)}`;
    document.getElementById('regIni').value = b.registradora_inicio ?? '';
    document.getElementById('regFin').value = b.registradora_fin ?? '';
    document.getElementById('regIniAntes').textContent = `Antes: ${fmtN(b.registradora_inicio)}`;
    document.getElementById('regFinAntes').textContent = `Antes: ${fmtN(b.registradora_fin)}`;

    const ant = vecino(busId, fecha, -1), sig = vecino(busId, fecha, 1);
    document.getElementById('regIniPista').innerHTML = ant
      ? `El ${ant.fecha.slice(8)}/${ant.fecha.slice(5,7)} terminó en ${fmtN(ant.registradora_fin)} · <button type="button" onclick="usarValor('regIni', ${ant.registradora_fin})">Usar</button>` : '';
    document.getElementById('regFinPista').innerHTML = sig
      ? `El ${sig.fecha.slice(8)}/${sig.fecha.slice(5,7)} empezó en ${fmtN(sig.registradora_inicio)} · <button type="button" onclick="usarValor('regFin', ${sig.registradora_inicio})">Usar</button>` : '';

    // Con relevo: la REG final de cada conductor que entrega el bus (= inicio del siguiente)
    const rel = b.relevos || [];
    // En orden del torniquete: Inicial → REG final de cada conductor que entrega → Final
    const campoFin = document.getElementById('regFin').closest('.campo');
    document.querySelector('#regModal .reg-grid').appendChild(campoFin);
    document.getElementById('regRelevos').innerHTML = rel.map((r, i) => `
      <div class="campo">
        <label for="regRel-${i}">REG final del conductor ${i + 1} · entrega a ${esc(r.conductor_nombre || 'conductor ' + r.orden)}</label>
        <input id="regRel-${i}" type="text" inputmode="numeric" autocomplete="off" value="${r.registradora ?? ''}" />
        <div class="antes">Antes: ${fmtN(r.registradora)} · es la REG inicio del conductor ${i + 2}</div>
      </div>`).join('');
    rel.forEach((_, i) => {
      const el = document.getElementById(`regRel-${i}`);
      el.addEventListener('input', () => {
        const limpio = el.value.replace(/\D/g, '');
        if (limpio !== el.value) el.value = limpio;
        actualizarPreview();
      });
    });
    if (rel.length) document.getElementById('regRelevos').appendChild(campoFin);
    document.getElementById('regIni').previousElementSibling.textContent = rel.length ? 'Inicial (conductor 1)' : 'Inicial';
    document.getElementById('regFin').previousElementSibling.textContent = rel.length
      ? `Final (conductor ${rel.length + 1}, REG fin del bus)` : 'Final';

    document.getElementById('regMotivo').value = '';
    document.getElementById('regErr').hidden = true;
    document.getElementById('regGuardar').disabled = false;
    document.getElementById('regModal').hidden = false;
    actualizarPreview();
    document.getElementById('regIni').focus();
  }

  function usarValor(id, v) {
    document.getElementById(id).value = v;
    actualizarPreview();
  }

  function cerrarCorreccion() {
    document.getElementById('regModal').hidden = true;
    corrigiendo = null;
  }

  function actualizarPreview() {
    if (!corrigiendo) return;
    const ini = leerN('regIni'), fin = leerN('regFin');
    const box = document.getElementById('regPax');
    const ant = corrigiendo;
    const paxAntes = (ant.registradora_inicio != null && ant.registradora_fin != null
                      && ant.registradora_fin >= ant.registradora_inicio)
      ? ant.registradora_fin - ant.registradora_inicio : null;
    let txt, mal = false;
    // Con relevo, las lecturas van en consecutivo: inicial < relevo(s) < final
    const rel = (ant.relevos || []).map((_, i) => leerN(`regRel-${i}`));
    const cadena = [ini, ...rel, fin];
    const malRelevo = rel.findIndex((v, i) => v == null || (cadena[i] != null && v <= cadena[i]));
    if (rel.length && malRelevo >= 0) {
      txt = rel[malRelevo] == null ? `Falta la REG final del conductor ${malRelevo + 1}`
        : `La REG final del conductor ${malRelevo + 1} debe ser mayor que ${fmtN(cadena[malRelevo])}`;
      mal = true;
    } else if (rel.length && fin != null && fin <= rel[rel.length - 1]) {
      txt = `La final debe ser mayor que ${fmtN(rel[rel.length - 1])} (relevo)`; mal = true;
    } else if (ini == null || fin == null) txt = '—';
    else if (fin < ini) { txt = 'La final es menor que la inicial'; mal = true; }
    else txt = fmtN(fin - ini) + (rel.length ? ` (${cadena.slice(1).map((v, i) => fmtN(v - cadena[i])).join(' + ')})` : '');
    box.classList.toggle('mal', mal);
    box.innerHTML = `<span>Pasajeros${paxAntes != null ? ` · antes ${fmtN(paxAntes)}` : ''}</span><strong>${txt}</strong>`;
    document.getElementById('regGuardar').disabled = mal;
  }

  ['regIni', 'regFin'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => {
      const limpio = el.value.replace(/\D/g, '');
      if (limpio !== el.value) el.value = limpio;
      actualizarPreview();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') guardarCorreccion(); });
  });
  document.getElementById('regModal').addEventListener('click', e => {
    if (e.target.id === 'regModal') cerrarCorreccion();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('regModal').hidden) cerrarCorreccion();
    if (e.key === 'Escape' && !document.getElementById('relModal').hidden) cerrarRelevo();
  });

  async function guardarCorreccion() {
    const b = corrigiendo;
    const btn = document.getElementById('regGuardar');
    if (!b || btn.disabled) return;
    const err = document.getElementById('regErr');
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    try {
      const res = await apiFetch('/api/despacho/registradora', {
        method: 'PUT',
        body: JSON.stringify({
          fecha: b.fecha, bus_id: b.bus_id,
          registradora_inicio: leerN('regIni'),
          registradora_fin: leerN('regFin'),
          ...((b.relevos || []).length ? { relevos_registradora: b.relevos.map((_, i) => leerN(`regRel-${i}`)) } : {}),
          motivo: document.getElementById('regMotivo').value.trim(),
        }),
      });
      if (res === null) return;
      b.registradora_inicio = res.registradora_inicio;
      b.registradora_fin    = res.registradora_fin;
      (res.relevos_registradora || []).forEach((v, i) => { if (b.relevos[i]) b.relevos[i].registradora = v; });
      cerrarCorreccion();
      const area = document.getElementById('tableArea');
      const scroll = area.scrollTop;
      render(filasCargadas);
      area.scrollTop = scroll;
      document.getElementById(`fila-${b.fecha}-${b.bus_id}`)?.classList.add('recien-corregido');
      mostrarToast(`Registradora del bus ${b.numero} corregida` +
        (res.pasajeros != null ? ` · ${fmtN(res.pasajeros)} pasajeros` : ''));
    } catch (e) {
      err.textContent = e.message;
      err.hidden = false;
      btn.disabled = false;
    } finally {
      btn.textContent = 'Guardar corrección';
    }
  }

  // ── Agregar o editar relevo de un día (solo Administrador) ──
  // Igual que en Despacho: cada conductor muestra su REG inicio (la del bus o la final del
  // anterior) y se pide su REG final; la del último es la REG fin del bus.
  const MAX_RELEVOS = 2;
  let relBus = null, relForm = null, catConductores = null, catRutas = null;

  async function cargarCatalogos() {
    if (catConductores && catRutas) return;
    const [conds, rutas] = await Promise.all([apiFetch('/api/conductores'), apiFetch('/api/rutas/all')]);
    catConductores = (conds || []).filter(c => c.activo !== 0 && c.activo !== false);
    catRutas = rutas || [];
  }
  const nombreCond = id => (catConductores || []).find(c => c.id === id)?.nombre || '';
  const nombreRutaCat = id => (catRutas || []).find(r => r.id === id)?.nombre || '';

  async function abrirRelevo(fecha, busId) {
    const b = filasCargadas.find(r => r.fecha === fecha && r.bus_id === busId);
    if (!b) return;
    try { await cargarCatalogos(); } catch (e) { mostrarToast(e.message); return; }
    const rel = (b.relevos || []).map(r => ({ conductor_id: r.conductor_id, ruta_id: r.ruta_id,
                                              registradora: r.registradora, viajes: r.viajes }));
    const viajesRel = rel.reduce((t, r) => t + (r.viajes || 0), 0);
    const v1 = b.viajes_realizados == null ? null : b.viajes_realizados - viajesRel;
    relBus = b;
    relForm = { viajes1: v1 != null && v1 >= 0 ? v1 : null, regFin: b.registradora_fin ?? null, relevos: rel };
    if (!rel.length) agregarLectura();
    document.getElementById('relSub').textContent = `Bus ${b.numero} · ${b.placa || 's/placa'} · ${formatFecha(fecha)}`;
    document.getElementById('relErr').hidden = true;
    document.getElementById('relGuardar').disabled = false;
    document.getElementById('relModal').hidden = false;
    renderRelevo();
  }

  function cerrarRelevo() {
    document.getElementById('relModal').hidden = true;
    relBus = relForm = null;
  }

  /* Al agregar un conductor, la REG fin que tenía el bus es donde el anterior lo entrega. */
  function agregarLectura() {
    const previo = relForm.relevos[relForm.relevos.length - 1];
    relForm.relevos.push({ conductor_id: null, ruta_id: (previo ? previo.ruta_id : relBus.ruta_id) || null,
                           registradora: relForm.regFin, viajes: null });
    relForm.regFin = null;
  }
  function agregarRelevo() {
    if (relForm.relevos.length >= MAX_RELEVOS) return;
    agregarLectura();
    renderRelevo();
  }
  function quitarRelevo() {
    const r = relForm.relevos.pop();
    if (r && relForm.regFin == null) relForm.regFin = r.registradora;
    renderRelevo();
  }

  const regInicioCond = k => k === 0 ? relBus.registradora_inicio : relForm.relevos[k - 1].registradora;
  const regFinalCond  = k => k < relForm.relevos.length ? relForm.relevos[k].registradora : relForm.regFin;

  function renderRelevo() {
    const b = relBus;
    const val = v => v == null ? '' : v;
    const total = relForm.relevos.length + 1;
    const opcRutas = sel => `<option value="">— Sin ruta —</option>` + catRutas
      .filter(r => r.grupo === b.grupo && (r.activa || r.id === sel))
      .map(r => `<option value="${r.id}" ${sel === r.id ? 'selected' : ''}>${esc(r.nombre)}</option>`).join('');
    const opcConductores = sel => `<option value="">— Elige el conductor —</option>` + catConductores
      .filter(c => c.id !== b.conductor_id)
      .map(c => `<option value="${c.id}" ${sel === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
    const lecturas = k => {
      const ultimo = k === total - 1;
      const ini = regInicioCond(k);
      const etq = ultimo && total > 1 ? `REG final del conductor ${k + 1} <small>(REG fin del bus)</small>`
                : ultimo ? 'REG fin del bus' : `REG final del conductor ${k + 1} <b>*</b>`;
      return `<div class="rel-dato">REG inicio: <b id="hrel-ini-${k}">${ini != null ? fmtN(ini) : '—'}</b>
               ${k > 0 ? '<br><small>la REG final del conductor ' + k + '</small>' : ''}</div>
          <div><label>${etq}</label>
               <input type="number" min="0" step="1" inputmode="numeric" value="${val(regFinalCond(k))}"
                      placeholder="${ultimo ? 'REG fin del bus' : 'Lectura al entregar el bus'}"
                      oninput="setFinal(${k}, this.value)"></div>`;
    };
    const sale = `<div class="rel-card sale">
        <div class="rel-head"><div class="rel-titulo">1 · ${esc(b.conductor_nombre || '')}<small>sale con el bus</small></div></div>
        <div class="rel-grid">
          <div class="rel-dato">Ruta: <b>${esc(b.ruta_nombre || '—')}</b></div>
          <div><label>Viajes del conductor 1</label>
               <input type="number" min="0" step="1" inputmode="numeric" value="${val(relForm.viajes1)}"
                      placeholder="0" oninput="setRel(-1, 'viajes', this.value)"></div>
          ${total > 1 ? lecturas(0) : ''}
        </div>
        ${total > 1 ? '<div class="rel-nota" id="hrel-nota-0"></div>' : ''}
      </div>`;
    const cards = relForm.relevos.map((r, i) => `<div class="rel-card">
        <div class="rel-head">
          <div class="rel-titulo">${i + 2} · Recibe el bus</div>
          ${i === relForm.relevos.length - 1 ? `<button class="rel-quitar" onclick="quitarRelevo()">Quitar</button>` : ''}
        </div>
        <div class="rel-grid">
          <div><label>Conductor <b>*</b></label>
               <select onchange="setRel(${i}, 'conductor_id', this.value)">${opcConductores(r.conductor_id)}</select></div>
          <div><label>Ruta</label>
               <select onchange="setRel(${i}, 'ruta_id', this.value)">${opcRutas(r.ruta_id)}</select></div>
          ${lecturas(i + 1)}
          <div><label>Viajes del conductor ${i + 2}</label>
               <input type="number" min="0" step="1" inputmode="numeric" value="${val(r.viajes)}"
                      placeholder="0" oninput="setRel(${i}, 'viajes', this.value)"></div>
        </div>
        <div class="rel-nota" id="hrel-nota-${i + 1}"></div>
      </div>`).join('');
    const agregar = relForm.relevos.length < MAX_RELEVOS
      ? `<button class="rel-agregar" onclick="agregarRelevo()">+ Agregar ${relForm.relevos.length ? 'otro relevo' : 'relevo'}</button>` : '';
    // Bus ya liquidado: solo se agregan los conductores que faltaron (lo liquidado no cambia)
    const avisoLiq = b.liquidado ? `<div class="rel-liquidado">Este bus ya está liquidado en Recaudo. Agrega aquí los
        conductores que faltaron, desde la lectura donde terminó lo liquidado; lo liquidado no cambia y el
        recaudador liquida el relevo aparte.</div>` : '';
    document.getElementById('relBody').innerHTML = avisoLiq + sale + cards + agregar + `<div class="rel-resumen" id="hrelResumen"></div>`;
    document.getElementById('relGuardar').textContent = relForm.relevos.length ? 'Guardar relevo' : 'Guardar sin relevo';
    pintarNotasRelevo();
  }

  function setRel(i, campo, raw) {
    const v = raw === '' || raw == null ? null : Number(raw);
    if (i < 0) relForm.viajes1 = v;
    else relForm.relevos[i][campo] = v;
    pintarNotasRelevo();
  }
  function setFinal(k, raw) {
    const v = raw === '' || raw == null ? null : Number(raw);
    if (k < relForm.relevos.length) relForm.relevos[k].registradora = v;
    else relForm.regFin = v;
    const ini = document.getElementById(`hrel-ini-${k + 1}`);
    if (ini) ini.textContent = v != null ? fmtN(v) : '—';
    pintarNotasRelevo();
  }

  function pintarNotasRelevo() {
    const b = relBus;
    const lect = [b.registradora_inicio, ...relForm.relevos.map(r => r.registradora), relForm.regFin];
    const nombres = [b.conductor_nombre, ...relForm.relevos.map((r, i) => nombreCond(r.conductor_id) || `Conductor ${i + 2}`)];
    nombres.forEach((_, k) => {
      const nota = document.getElementById(`hrel-nota-${k}`);
      if (!nota) return;
      const ini = lect[k], fin = lect[k + 1];
      let txt = '', err = false;
      if (fin != null && ini != null) {
        if (fin <= ini) { txt = `La REG final debe ser mayor que la REG inicio (${fmtN(ini)})`; err = true; }
        else txt = `${fmtN(fin - ini)} pasajeros (${fmtN(ini)} → ${fmtN(fin)})`;
      } else if (k === nombres.length - 1) {
        txt = 'La REG final del último conductor es la REG fin del bus.';
      } else if (ini != null) {
        txt = `Escribe la registradora cuando entregó el bus: mayor que ${fmtN(ini)}`;
      }
      nota.textContent = txt;
      nota.className = 'rel-nota' + (err ? ' err' : '');
    });
    const viajes = [relForm.viajes1, ...relForm.relevos.map(r => r.viajes)].filter(v => v != null);
    const total = viajes.length ? viajes.reduce((t, v) => t + v, 0) : null;
    let filas = '';
    if (relForm.relevos.length) {
      nombres.forEach((nom, i) => {
        const ini = lect[i], fin = lect[i + 1];
        filas += `<div class="fila"><span>${i + 1}. ${esc(nom || '—')}</span><span>${ini != null && fin != null && fin > ini ? fmtN(fin - ini) + ' pax' : '—'}</span></div>`;
      });
    }
    document.getElementById('hrelResumen').innerHTML = filas +
      `<div class="fila" style="${filas ? 'border-top:1px solid #e9e3ff;margin-top:4px;padding-top:4px' : ''}">
         <span>Total de viajes del bus</span><span>${total == null ? '—' : total}</span></div>`;
  }

  async function guardarRelevo() {
    const b = relBus;
    const btn = document.getElementById('relGuardar');
    if (!b || btn.disabled) return;
    const err = document.getElementById('relErr');
    err.hidden = true;
    btn.disabled = true;
    try {
      const res = await apiFetch('/api/despacho/relevos', {
        method: 'PUT',
        body: JSON.stringify({ fecha: b.fecha, bus_id: b.bus_id, viajes: relForm.viajes1,
                               relevos: relForm.relevos, registradora_fin: relForm.regFin }),
      });
      if (res === null) return;
      b.relevos = (res.relevos || []).map(r => ({ ...r, conductor_nombre: nombreCond(r.conductor_id),
                                                   ruta_nombre: nombreRutaCat(r.ruta_id) }));
      b.viajes_realizados = res.viajes_realizados;
      if ('registradora_fin' in res) b.registradora_fin = res.registradora_fin;
      cerrarRelevo();
      const area = document.getElementById('tableArea');
      const scroll = area.scrollTop;
      render(filasCargadas);
      area.scrollTop = scroll;
      document.getElementById(`fila-${b.fecha}-${b.bus_id}`)?.classList.add('recien-corregido');
      mostrarToast(b.relevos.length ? `Bus ${b.numero}: relevo guardado (${b.relevos.length + 1} conductores)`
                                    : `Bus ${b.numero}: sin relevo`);
    } catch (e) {
      err.textContent = e.message;
      err.hidden = false;
    } finally {
      btn.disabled = false;
    }
  }
  document.getElementById('relModal').addEventListener('click', e => {
    if (e.target.id === 'relModal') cerrarRelevo();
  });

  let toastTimer = null;
  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
  }

  // Carga inicial
  cargar();
</script>
</body>
</html>
